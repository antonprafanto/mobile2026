<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR LENGKAP FULLSTACK CAPSTONE SUPERAPP 2026</text>

  <!-- Layer 1: Flutter Client App -->
  <g transform="translate(30, 55)">
    <rect width="230" height="215" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="115" y="21" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1. FLUTTER CLIENT</text>

    <!-- Details -->
    <rect x="15" y="45" width="200" height="155" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="68" fill="#F8FAFC" font-family="monospace" font-size="9">📱 Clean Arch (Feature-First)</text>
    <text x="25" y="86" fill="#34D399" font-family="monospace" font-size="9">⚡ BLoC / Cubit State Engine</text>
    <text x="25" y="104" fill="#FDE047" font-family="monospace" font-size="9">💾 Drift &amp; Isar Offline Cache</text>
    <text x="25" y="122" fill="#38BDF8" font-family="monospace" font-size="9">🗺️ Live GPS Tracking Polyline</text>
    <text x="25" y="140" fill="#A5B4FC" font-family="monospace" font-size="9">🖨️ Thermal Printer (Platform Ch)</text>
    <text x="25" y="158" fill="#FDA4AF" font-family="monospace" font-size="9">🔒 SSL Pinning &amp; Keystore Vault</text>
    <text x="25" y="180" fill="#94A3B8" font-family="monospace" font-size="8">✓ 60 FPS Impeller Engine</text>
  </g>

  <!-- Arrow 1 (Bidirectional HTTP/WSS) -->
  <path d="M 270 150 L 305 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="305,145 315,150 305,155" fill="#818CF8"/>
  <path d="M 305 165 L 270 165" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="270,160 260,165 270,170" fill="#38BDF8"/>
  <text x="288" y="140" fill="#818CF8" font-family="monospace" font-size="8" text-anchor="middle">HTTPS</text>
  <text x="288" y="182" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle">WSS</text>

  <!-- Layer 2: Fullstack Backend & Cloud Services -->
  <g transform="translate(315, 55)">
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="260" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="130" y="21" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. BACKEND &amp; REALTIME CLOUD</text>

    <!-- Details -->
    <rect x="15" y="45" width="230" height="155" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" fill="#34D399" font-family="monospace" font-size="9">🐸 Dart Frog REST API / BFF</text>
    <text x="25" y="88" fill="#38BDF8" font-family="monospace" font-size="9">🐘 PostgreSQL Relational DB</text>
    <text x="25" y="108" fill="#FDE047" font-family="monospace" font-size="9">⚡ Supabase Realtime Stream</text>
    <text x="25" y="128" fill="#A5B4FC" font-family="monospace" font-size="9">🔑 JWT Auth &amp; Role-Based RLS</text>
    <text x="25" y="148" fill="#FDA4AF" font-family="monospace" font-size="9">🌐 WebSocket Order Broadcast</text>
    <text x="130" y="180" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">⚡ Sub-second Latency</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 585 150 L 615 150" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="615,145 625,150 615,155" fill="#F59E0B"/>

  <!-- Layer 3: Third-Party Enterprise Services -->
  <g transform="translate(625, 55)">
    <rect width="205" height="215" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="205" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="102" y="21" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3. THIRD-PARTY HUBS</text>

    <!-- Details -->
    <rect x="10" y="45" width="185" height="155" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="68" fill="#FDE047" font-family="monospace" font-size="9">💳 Midtrans / Stripe Webhook</text>
    <text x="20" y="90" fill="#38BDF8" font-family="monospace" font-size="9">🔔 Firebase FCM Push Notif</text>
    <text x="20" y="112" fill="#FDA4AF" font-family="monospace" font-size="9">🚨 Sentry Error Monitoring</text>
    <text x="20" y="134" fill="#34D399" font-family="monospace" font-size="9">🕊️ Shorebird OTA CodePush</text>
    <text x="20" y="156" fill="#A5B4FC" font-family="monospace" font-size="9">🚀 GitHub Actions CI/CD</text>
    <text x="102" y="180" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">✓ Enterprise SLA</text>
  </g>
</svg>
