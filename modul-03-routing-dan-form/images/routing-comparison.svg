<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">NAVIGASI IMPERATIVE (NAVIGATOR 1.0) VS DEKLARATIF (GO_ROUTER)</text>

  <!-- Left: Imperative (Navigator 1.0) -->
  <g transform="translate(30, 50)">
    <rect width="380" height="230" rx="12" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="380" height="36" rx="12" fill="#881337" fill-opacity="0.3"/>
    <text x="190" y="24" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. IMPERATIVE (Navigator.push/pop)</text>

    <!-- Stack visual -->
    <g transform="translate(40, 55)">
      <rect x="0" y="0" width="300" height="32" rx="6" fill="#BE123C" fill-opacity="0.3" stroke="#F43F5E" stroke-width="1"/>
      <text x="150" y="21" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Page 3 (Detail Screen) [TOP]</text>
      
      <rect x="0" y="40" width="300" height="32" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="150" y="61" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Page 2 (Katalog Screen)</text>
      
      <rect x="0" y="80" width="300" height="32" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="150" y="101" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Page 1 (Home Screen) [BOTTOM]</text>
    </g>

    <text x="190" y="195" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">⚠️ Sulit menangani Deep Linking &amp; URL Web</text>
    <text x="190" y="212" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Manipulasi tumpukan stack secara manual</text>
  </g>

  <!-- Right: Declarative (go_router) -->
  <g transform="translate(450, 50)">
    <rect width="380" height="230" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="380" height="36" rx="12" fill="#065F46" fill-opacity="0.3"/>
    <text x="190" y="24" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. DEKLARATIF (go_router URI-Driven)</text>

    <!-- URI Path Visual -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="320" height="32" rx="6" fill="#047857" fill-opacity="0.3" stroke="#34D399" stroke-width="1"/>
      <text x="160" y="21" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">URL: /katalog/produk/45</text>
      
      <rect x="0" y="42" width="320" height="68" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="20" y="65" fill="#E2E8F0" font-family="monospace" font-size="11">➔ context.go('/katalog/produk/45')</text>
      <text x="20" y="88" fill="#FDE047" font-family="monospace" font-size="11">➔ Deep Link &amp; Auth Guard Otomatis</text>
    </g>

    <text x="190" y="195" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✅ Standar Resmi Flutter Production (2026)</text>
    <text x="190" y="212" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Sinkron otomatis dengan URL browser &amp; Deep Link HP</text>
  </g>
</svg>
