<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#F87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MEKANISME PROTEKSI TOMBOL BACK DENGAN POPSCOPE (ANDROID 14+)</text>

  <!-- Step 1: User Action (Back Trigger) -->
  <g transform="translate(30, 65)">
    <rect width="210" height="195" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="210" height="32" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="105" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. PEMICU TOMBOL KEMBALI</text>

    <text x="105" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Aksi Pengguna:</text>
    <text x="20" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">• Geser tepi layar (Gesture)</text>
    <text x="20" y="108" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">• Tombol Back fisik/navigasi</text>
    <text x="20" y="131" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">• Ikon panah kiri di AppBar</text>

    <rect x="15" y="148" width="180" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="169" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Predictive Back Android 14+</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="162" x2="275" y2="162" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: PopScope Evaluation -->
  <g transform="translate(285, 55)">
    <rect width="280" height="215" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="280" height="34" rx="12" fill="#4F46E5" fill-opacity="0.3"/>
    <text x="140" y="23" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. EVALUASI POPSCOPE</text>

    <text x="20" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold">Cek Parameter canPop:</text>
    <rect x="15" y="78" width="250" height="52" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="25" y="98" fill="#38BDF8" font-family="monospace" font-size="11">canPop: !_apakahFormBerubah,</text>
    <text x="25" y="118" fill="#38BDF8" font-family="monospace" font-size="11">onPopInvokedWithResult: ...</text>

    <text x="140" y="152" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Status Formulir:</text>
    <text x="140" y="172" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">Apakah ada teks yang belum disimpan?</text>
    <text x="140" y="192" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">(Pengganti resmi WillPopScope)</text>
  </g>

  <!-- Branching Arrows -->
  <!-- canPop == true (Boleh keluar) -->
  <path d="M 565 125 L 610 125 L 610 95 L 635 95" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="580" y="115" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">canPop: true</text>

  <!-- canPop == false (Tahan & Panggil Dialog) -->
  <path d="M 565 195 L 610 195 L 610 225 L 635 225" fill="none" stroke="#F87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="575" y="215" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">canPop: false</text>

  <!-- Destination 1: Langsung Keluar -->
  <g transform="translate(645, 55)">
    <rect width="225" height="90" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <text x="112" y="28" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✅ Langsung Keluar Layar</text>
    <text x="112" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">Form kosong atau sudah disimpan.</text>
    <text x="112" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Animasi kembali berjalan alami.</text>
  </g>

  <!-- Destination 2: Tahan & Muncul Dialog -->
  <g transform="translate(645, 175)">
    <rect width="225" height="95" rx="10" fill="url(#cardGrad)" stroke="#F87171" stroke-width="1.5"/>
    <text x="112" y="26" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚠️ Dicegah &amp; Muncul Dialog</text>
    <text x="112" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">"Batalkan perubahan input?"</text>
    <text x="112" y="68" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">[Lanjut Mengisi] vs [Ya, Keluar]</text>
    <text x="112" y="85" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Data user aman dari kecelakaan!</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="30" y="295" width="840" height="42" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="450" y="321" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Pengalaman Pengguna Kelas Dunia: PopScope melindungi pengguna dari ketidaksengajaan kehilangan data!</text>
</svg>

