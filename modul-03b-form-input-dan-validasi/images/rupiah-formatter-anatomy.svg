<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="380" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ANATOMI TEXTINPUTFORMATTER: PIPELINE FORMAT RUPIAH OTOMATIS</text>

  <!-- Step 1: Input Ketikan Mentah -->
  <g transform="translate(30, 65)">
    <rect width="190" height="235" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="190" height="32" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="95" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">1. INPUT MENTAH</text>

    <text x="95" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">User Mengetik di HP:</text>
    <rect x="20" y="74" width="150" height="34" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="95" y="96" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">"150000"</text>

    <text x="95" y="136" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Diterima parameter:</text>
    <rect x="15" y="150" width="160" height="42" rx="6" fill="#090D16" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="176" fill="#E2E8F0" font-family="monospace" font-size="11">newValue.text</text>

    <text x="95" y="214" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Belum ada titik ribuan</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="180" x2="250" y2="180" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Pembersihan Regex -->
  <g transform="translate(255, 65)">
    <rect width="195" height="235" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="195" height="32" rx="12" fill="#4F46E5" fill-opacity="0.3"/>
    <text x="97" y="22" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">2. FILTER REGEX</text>

    <text x="97" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Bersihkan Non-Angka:</text>
    <rect x="12" y="74" width="171" height="50" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="20" y="94" fill="#64748B" font-family="monospace" font-size="9.5">// Hapus huruf &amp; simbol:</text>
    <text x="20" y="112" fill="#A5B4FC" font-family="monospace" font-size="9.5">replaceAll('[^0-9]', '')</text>

    <text x="97" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Hasil Angka Murni:</text>
    <rect x="20" y="160" width="155" height="32" rx="6" fill="#090D16" stroke="#818CF8" stroke-width="1"/>
    <text x="97" y="181" fill="#A5B4FC" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">150000 (double)</text>

    <text x="97" y="214" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Siap diformat mata uang</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="180" x2="480" y2="180" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Format intl Mata Uang -->
  <g transform="translate(485, 65)">
    <rect width="195" height="235" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="195" height="32" rx="12" fill="#D97706" fill-opacity="0.25"/>
    <text x="97" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">3. FORMATTER INTL</text>

    <text x="97" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Pustaka intl Resmi:</text>
    <rect x="12" y="74" width="171" height="50" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="94" fill="#FCD34D" font-family="monospace" font-size="9.5">NumberFormat.currency(</text>
    <text x="20" y="112" fill="#FCD34D" font-family="monospace" font-size="9.5">  locale: 'id_ID', ...)</text>

    <text x="97" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Hasil String Format:</text>
    <rect x="20" y="160" width="155" height="32" rx="6" fill="#090D16" stroke="#F59E0B" stroke-width="1"/>
    <text x="97" y="181" fill="#FCD34D" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">"Rp 150.000"</text>

    <text x="97" y="214" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Tersedia titik pemisah</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="680" y1="180" x2="710" y2="180" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Kursor & Tampilan Akhir -->
  <g transform="translate(715, 65)">
    <rect width="175" height="235" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="175" height="32" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="87" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">4. POSISI KURSOR</text>

    <text x="87" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Kunci Kursor di Ujung:</text>
    <rect x="10" y="74" width="155" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="16" y="94" fill="#6EE7B7" font-family="monospace" font-size="9.5">TextSelection.collapsed(</text>
    <text x="16" y="112" fill="#6EE7B7" font-family="monospace" font-size="9.5">  offset: text.length)</text>

    <text x="87" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Tampilan di Layar:</text>
    <rect x="10" y="160" width="155" height="32" rx="6" fill="#065F46" stroke="#34D399" stroke-width="1"/>
    <text x="87" y="181" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Rp 150.000|</text>

    <text x="87" y="214" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">✅ Rapi &amp; Alami!</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="30" y="325" width="860" height="36" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="348" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✨ Manfaat: Pengguna terhindar dari salah ketik jumlah nol (misal 1 juta vs 10 juta) secara visual instan.</text>
</svg>
