# Pemeriksaan otomatis setiap kali ada push ke branch main.
# Memastikan seluruh contoh kode rapi (dart format) dan bersih dari
# error, peringatan, maupun API usang (flutter analyze --fatal-infos).
name: Quality Gate Kode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  periksa-kode:
    name: Format & analisis kode
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v5

      - name: Pasang Flutter (kanal stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tampilkan versi Flutter
        run: flutter --version

      - name: Unduh paket
        run: flutter pub get

      - name: Cek format kode (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis kode (flutter analyze)
        run: flutter analyze --fatal-infos
