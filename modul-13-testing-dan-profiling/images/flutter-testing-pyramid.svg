<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIRAMIDA PENGUJIAN FLUTTER (THE TESTING PYRAMID)</text>

  <!-- Tier 1: Integration Test (Top) -->
  <g transform="translate(180, 55)">
    <polygon points="250,0 150,55 350,55" fill="#F43F5E" fill-opacity="0.3" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="250" y="42" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Integration Tests (10%)</text>
  </g>

  <!-- Tier 2: Widget Test (Middle) -->
  <g transform="translate(180, 115)">
    <polygon points="150,0 80,60 420,60 350,0" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="250" y="38" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Widget / Golden Tests (20%)</text>
  </g>

  <!-- Tier 3: Unit Test (Base) -->
  <g transform="translate(180, 180)">
    <polygon points="80,0 0,65 500,65 420,0" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <text x="250" y="40" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Unit Tests: BLoC, UseCase, Models (70%)</text>
  </g>

  <!-- Right: Metrics Legend Card -->
  <g transform="translate(560, 60)">
    <rect width="260" height="185" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="260" height="30" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="130" y="20" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">METRIK EFISIENSI PENGUJIAN</text>

    <!-- Unit Test Metrics -->
    <rect x="15" y="40" width="230" height="36" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="55" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold">⚡ Unit Test:</text>
    <text x="25" y="68" fill="#94A3B8" font-family="monospace" font-size="9">Kecepatan: ~2ms | Biaya: Rendah</text>

    <!-- Widget Test Metrics -->
    <rect x="15" y="82" width="230" height="36" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="97" fill="#FDE047" font-family="monospace" font-size="9" font-weight="bold">🖼️ Widget Test:</text>
    <text x="25" y="110" fill="#94A3B8" font-family="monospace" font-size="9">Kecepatan: ~200ms | Headless Render</text>

    <!-- Integration Test Metrics -->
    <rect x="15" y="124" width="230" height="36" rx="4" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="25" y="139" fill="#FDA4AF" font-family="monospace" font-size="9" font-weight="bold">📱 Integration Test:</text>
    <text x="25" y="152" fill="#94A3B8" font-family="monospace" font-size="9">Kecepatan: ~15s | Real Device Flow</text>

    <text x="130" y="176" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">Target Coverage: &gt; 85%</text>
  </g>
</svg>
