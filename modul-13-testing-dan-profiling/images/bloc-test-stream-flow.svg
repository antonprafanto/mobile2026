<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE UNIT TEST BLOC / CUBIT DENGAN BLOCTEST &amp; MOCKTAIL</text>

  <!-- Step 1: Arrange / Build -->
  <g transform="translate(30, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. BUILD (MOCK)</text>

    <!-- Code Block -->
    <rect x="10" y="45" width="160" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="20" y="68" fill="#FDE047" font-family="monospace" font-size="9">when(() =&gt; mockRepo</text>
    <text x="25" y="86" fill="#34D399" font-family="monospace" font-size="9">  .getBalance())</text>
    <text x="20" y="106" fill="#F8FAFC" font-family="monospace" font-size="9">.thenAnswer((_) async</text>
    <text x="25" y="126" fill="#34D399" font-family="monospace" font-size="9">  =&gt; Right(mockData));</text>
    <text x="20" y="152" fill="#38BDF8" font-family="monospace" font-size="9">return BalanceBloc(..);</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 215 150 L 245 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="245,145 255,150 245,155" fill="#818CF8"/>

  <!-- Step 2: Act / Trigger -->
  <g transform="translate(255, 55)">
    <rect width="170" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="85" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. ACT (TRIGGER)</text>

    <!-- Code Block -->
    <rect x="10" y="45" width="150" height="135" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="20" y="75" fill="#F8FAFC" font-family="monospace" font-size="10">act: (bloc) =&gt;</text>
    <text x="20" y="100" fill="#38BDF8" font-family="monospace" font-size="10">bloc.add(</text>
    <text x="25" y="122" fill="#FDE047" font-family="monospace" font-size="9">FetchBalance()</text>
    <text x="20" y="145" fill="#38BDF8" font-family="monospace" font-size="10">);</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 430 150 L 460 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="460,145 470,150 460,155" fill="#10B981"/>

  <!-- Step 3: Expect Stream Emissions -->
  <g transform="translate(470, 55)">
    <rect width="210" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="210" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="105" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. EXPECT (ASSERT)</text>

    <!-- Sequence List -->
    <rect x="10" y="45" width="190" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="20" y="68" fill="#F8FAFC" font-family="monospace" font-size="9">expect: () =&gt; [</text>
    <text x="25" y="92" fill="#FDE047" font-family="monospace" font-size="9">  1. BalanceLoading(),</text>
    <text x="25" y="116" fill="#34D399" font-family="monospace" font-size="9">  2. BalanceLoaded(..),</text>
    <text x="20" y="138" fill="#F8FAFC" font-family="monospace" font-size="9">],</text>
    <text x="20" y="162" fill="#A7F3D0" font-family="monospace" font-size="8">✓ Urutan State 100% Cocok</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 685 150 L 715 150" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="715,145 725,150 715,155" fill="#F59E0B"/>

  <!-- Step 4: Verify -->
  <g transform="translate(725, 55)">
    <rect width="105" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="105" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="52" y="21" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4. VERIFY</text>

    <text x="52" y="70" fill="#34D399" font-family="monospace" font-size="24" text-anchor="middle">✅</text>
    <text x="52" y="105" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">called(1)</text>

    <text x="52" y="145" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">No Extra</text>
    <text x="52" y="160" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Calls</text>
  </g>
</svg>
