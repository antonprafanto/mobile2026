<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">REALTIME CRASH MONITORING &amp; ERROR TRACKING DENGAN SENTRY</text>

  <!-- Step 1: Uncaught Error in Flutter App -->
  <g transform="translate(30, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#9F1239" fill-opacity="0.3"/>
    <text x="110" y="21" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. UNCAUGHT EXCEPTION</text>

    <!-- Code Box -->
    <rect x="10" y="45" width="200" height="135" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="20" y="68" fill="#F8FAFC" font-family="monospace" font-size="9">runZonedGuarded(() {</text>
    <text x="30" y="86" fill="#FDA4AF" font-family="monospace" font-size="9">  throw NetworkError();</text>
    <text x="20" y="104" fill="#F8FAFC" font-family="monospace" font-size="9">}, (error, stackTrace) {</text>
    <text x="30" y="126" fill="#38BDF8" font-family="monospace" font-size="9">  Sentry.captureException(</text>
    <text x="40" y="144" fill="#FDE047" font-family="monospace" font-size="9">    error, stackTrace);</text>
    <text x="20" y="166" fill="#F8FAFC" font-family="monospace" font-size="9">});</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 260 150 L 290 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="290,145 300,150 290,155" fill="#818CF8"/>

  <!-- Step 2: Sentry SDK Breadcrumbs & Context -->
  <g transform="translate(300, 55)">
    <rect width="250" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="125" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. BREADCRUMBS &amp; CONTEXT</text>

    <!-- Context List -->
    <rect x="15" y="45" width="220" height="135" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="25" y="68" fill="#38BDF8" font-family="monospace" font-size="9">📍 Nav: /login ➔ /transfer</text>
    <text x="25" y="88" fill="#FDE047" font-family="monospace" font-size="9">🌐 HTTP: POST /api/v1/pay (500)</text>
    <text x="25" y="108" fill="#34D399" font-family="monospace" font-size="9">📱 Device: Samsung S24 (Android 15)</text>
    <text x="25" y="128" fill="#A5B4FC" font-family="monospace" font-size="9">👤 User ID: usr_a89f (Anonymized)</text>
    <text x="25" y="152" fill="#94A3B8" font-family="monospace" font-size="8">⚡ Auto Symbol Map Deobfuscation</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 560 150 L 590 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="590,145 600,150 590,155" fill="#10B981"/>

  <!-- Step 3: Sentry Dashboard & Instant Alerts -->
  <g transform="translate(600, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="230" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. ALERT &amp; DASHBOARD</text>

    <!-- Dashboard Badge -->
    <rect x="15" y="50" width="200" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="75" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">🚨 1 Crash Detected</text>
    <text x="115" y="95" fill="#F8FAFC" font-family="monospace" font-size="8" text-anchor="middle">Slack/Discord Alert Sent ⚡</text>
    <text x="115" y="115" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">99.98% Crash-Free Users</text>

    <text x="115" y="165" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">MTTR (Mean Time to Resolve) &lt; 15m</text>
  </g>
</svg>
