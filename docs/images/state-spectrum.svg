<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SPEKTRUM STATE MANAGEMENT: EPHEMERAL VS APP STATE</text>

  <!-- Left: Ephemeral (Local) State -->
  <g transform="translate(30, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="34" rx="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. EPHEMERAL STATE (Lokal Widget)</text>

    <!-- Scope Circle -->
    <rect x="25" y="48" width="330" height="75" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="190" y="72" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">setState() / ValueNotifier</text>
    <text x="190" y="94" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Hanya hidup di dalam 1 widget (misal: toggle password)</text>
    <text x="190" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Hancur saat widget di-dispose</text>

    <text x="190" y="152" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Contoh Kasus:</text>
    <text x="190" y="172" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Index Tab aktif, Animasi Controller, Slider volume</text>
  </g>

  <!-- Right: App (Global) State -->
  <g transform="translate(450, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="380" height="34" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. APP STATE (Global / Multi-Screen)</text>

    <!-- Scope Box -->
    <rect x="25" y="48" width="330" height="75" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="190" y="72" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Provider / Riverpod / BLoC</text>
    <text x="190" y="94" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Dibagikan ke banyak layar &amp; dipersistensikan</text>
    <text x="190" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Tetap aktif saat berpindah rute halaman</text>

    <text x="190" y="152" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Contoh Kasus:</text>
    <text x="190" y="172" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Keranjang Belanja, Sesi Login Pengguna, Tema Gelap</text>
  </g>
</svg>
