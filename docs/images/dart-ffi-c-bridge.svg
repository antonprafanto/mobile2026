<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DART FFI (FOREIGN FUNCTION INTERFACE): INTEGRASI LANGSUNG C / C++ ZERO-OVERHEAD</text>

  <!-- Step 1: Dart FFI Binding -->
  <g transform="translate(30, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="120" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. DART FFI (dart:ffi)</text>

    <text x="120" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Dynamic Library Lookup:</text>

    <rect x="15" y="80" width="210" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="102" fill="#FDE047" font-family="monospace" font-size="9">DynamicLibrary.open(</text>
    <text x="35" y="120" fill="#A7F3D0" font-family="monospace" font-size="9">'libcrypto_core.so');</text>
    <text x="25" y="140" fill="#38BDF8" font-family="monospace" font-size="9">lookupFunction&lt;C, Dart&gt;(</text>
    <text x="35" y="155" fill="#F8FAFC" font-family="monospace" font-size="9">'hash_sha256');</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 280 150 L 315 150" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="315,145 325,150 315,155" fill="#38BDF8"/>

  <!-- Step 2: Memory Bridge (Zero-Copy) -->
  <g transform="translate(325, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. MEMORY POINTERS</text>

    <text x="115" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Alokasi Memori Langsung:</text>

    <rect x="15" y="80" width="200" height="85" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="105" fill="#34D399" font-family="monospace" font-size="10">calloc&lt;Uint8&gt;(1024)</text>
    <text x="25" y="125" fill="#FDE047" font-family="monospace" font-size="10">Pointer&lt;Utf8&gt; ptr</text>
    <text x="25" y="145" fill="#FDA4AF" font-family="monospace" font-size="10">calloc.free(ptr)</text>
    <text x="115" y="185" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">⚡ Zero-Copy Native Speed</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 565 150 L 600 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="600,145 610,150 600,155" fill="#10B981"/>

  <!-- Step 3: Compiled C/C++ Shared Library -->
  <g transform="translate(610, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="220" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="110" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. C / C++ NATIVE ENGINE</text>

    <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Kompilasi Biner Mesin:</text>

    <rect x="15" y="80" width="190" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="105" fill="#34D399" font-family="monospace" font-size="9">#include &lt;stdint.h&gt;</text>
    <text x="25" y="125" fill="#A7F3D0" font-family="monospace" font-size="9">int32_t process_audio(</text>
    <text x="35" y="145" fill="#A7F3D0" font-family="monospace" font-size="9">  uint8_t* buffer, int len);</text>

    <text x="110" y="185" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Android .so / iOS .dylib</text>
  </g>
</svg>
