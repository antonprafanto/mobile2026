<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE GLSL FRAGMENT SHADER DENGAN FLUTTER IMPELLER GPU ENGINE</text>

  <!-- Step 1: GLSL .frag Source Code -->
  <g transform="translate(30, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#7E22CE" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. GLSL SHADER (.frag)</text>

    <!-- Shader Code -->
    <rect x="15" y="45" width="210" height="135" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
    <text x="25" y="68" fill="#FDE047" font-family="monospace" font-size="9">#version 460 core</text>
    <text x="25" y="86" fill="#38BDF8" font-family="monospace" font-size="9">uniform vec2 uSize;</text>
    <text x="25" y="104" fill="#38BDF8" font-family="monospace" font-size="9">uniform float uTime;</text>
    <text x="25" y="122" fill="#34D399" font-family="monospace" font-size="9">out vec4 fragColor;</text>
    <text x="25" y="145" fill="#C084FC" font-family="monospace" font-size="9">void main() { ... }</text>
    <text x="25" y="165" fill="#EC4899" font-family="monospace" font-size="9">  fragColor = vec4(...);</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 285 150 L 315 150" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="315,145 325,150 315,155" fill="#A855F7"/>

  <!-- Step 2: Impeller Shader Compiler -->
  <g transform="translate(325, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. IMPELLER ENGINE</text>

    <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">GPU Bytecode Compilation:</text>

    <rect x="15" y="80" width="190" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="105" fill="#34D399" font-family="monospace" font-size="9">FragmentProgram.fromAsset(</text>
    <text x="35" y="123" fill="#A7F3D0" font-family="monospace" font-size="9">'shaders/aurora.frag')</text>
    <text x="25" y="145" fill="#FDE047" font-family="monospace" font-size="9">shader.setFloat(0, time);</text>

    <text x="110" y="185" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">⚡ Zero Shader Compilation Janks</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 560 150 L 590 150" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="590,145 600,150 590,155" fill="#EC4899"/>

  <!-- Step 3: Visual Realtime Per-Pixel Output -->
  <g transform="translate(600, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="2" filter="url(#glow)"/>
    <rect width="230" height="32" rx="10" fill="#9D174D" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#F472B6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. VISUAL GPU OUTPUT</text>

    <!-- Liquid Shader Preview -->
    <rect x="15" y="45" width="200" height="100" rx="8" fill="url(#auroraGrad)"/>
    <text x="115" y="100" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Cyber Hologram Glow</text>

    <text x="115" y="165" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">120 FPS Liquid Wave FX</text>
    <text x="115" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Kustomisasi Efek Finansial</text>
  </g>
</svg>
