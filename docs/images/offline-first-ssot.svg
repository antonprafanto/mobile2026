<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR OFFLINE-FIRST: SINGLE SOURCE OF TRUTH (SSOT)</text>

  <!-- Left: UI Layer -->
  <g transform="translate(30, 55)">
    <rect width="210" height="210" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="105" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. UI SCREEN (VIEW)</text>

    <text x="105" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Tampilan Antarmuka</text>
    <text x="105" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">HANYA membaca data dari</text>
    <text x="105" y="110" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Local Database (Drift)</text>

    <rect x="15" y="135" width="180" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="105" y="157" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ 0ms Latency</text>
    <text x="105" y="175" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Aplikasi terbuka instan tanpa loading spinner!</text>
  </g>

  <!-- Dual Arrows: UI <-> Local DB -->
  <g transform="translate(245, 120)">
    <!-- Stream read -->
    <path d="M 70 0 L 10 0" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="10,-5 0,0 10,5" fill="#34D399"/>
    <text x="40" y="-8" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">watch() Stream</text>

    <!-- Write mutation -->
    <path d="M 10 40 L 70 40" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="70,35 80,40 70,45" fill="#38BDF8"/>
    <text x="40" y="55" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Insert/Update</text>
  </g>

  <!-- Middle: Local DB (Drift SSOT) -->
  <g transform="translate(330, 55)">
    <rect width="220" height="210" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="220" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="110" y="23" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2. LOCAL DB (SSOT)</text>

    <text x="110" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Drift SQLite Engine</text>
    <text x="110" y="88" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Satu-satunya sumber kebenaran data di perangkat</text>

    <rect x="15" y="115" width="190" height="75" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="105" y="137" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Tabel Data Utama</text>
    <text x="105" y="157" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Tabel SyncQueue</text>
    <text x="105" y="175" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">(Menyimpan mutasi offline)</text>
  </g>

  <!-- Dual Arrows: Local DB <-> Sync Engine / Remote API -->
  <g transform="translate(555, 120)">
    <!-- Pull sync -->
    <path d="M 65 0 L 10 0" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="10,-5 0,0 10,5" fill="#F59E0B"/>
    <text x="35" y="-8" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Pull (Save)</text>

    <!-- Push sync queue -->
    <path d="M 10 40 L 65 40" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="65,35 75,40 65,45" fill="#818CF8"/>
    <text x="35" y="55" fill="#818CF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Push (Queue)</text>
  </g>

  <!-- Right: Remote Backend API -->
  <g transform="translate(635, 55)">
    <rect width="195" height="210" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="195" height="34" rx="12" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="97" y="23" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. REMOTE SERVER</text>

    <text x="97" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Cloud REST API</text>
    <text x="97" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">PostgreSQL Server</text>

    <rect x="15" y="135" width="165" height="60" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="97" y="157" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Background Sync</text>
    <text x="97" y="175" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Sinkronisasi senyap saat ada internet</text>
  </g>
</svg>
