<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR MONOREPO FLUTTER DENGAN MELOS WORKSPACE MANAGER</text>

  <!-- Left: Root Melos Config -->
  <g transform="translate(30, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ROOT / melos.yaml</text>

    <!-- Config Code -->
    <rect x="15" y="45" width="200" height="100" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="68" fill="#FDE047" font-family="monospace" font-size="10">name: superapp_fintech</text>
    <text x="25" y="86" fill="#38BDF8" font-family="monospace" font-size="10">packages:</text>
    <text x="35" y="104" fill="#34D399" font-family="monospace" font-size="9">- 'apps/**'</text>
    <text x="35" y="122" fill="#34D399" font-family="monospace" font-size="9">- 'packages/**'</text>
    <text x="25" y="140" fill="#A7F3D0" font-family="monospace" font-size="9">scripts: melos bootstrap</text>

    <text x="115" y="180" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Satu Repo, Multi-Package</text>
  </g>

  <!-- Middle Arrows -->
  <path d="M 270 110 L 305 90" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 270 150 L 305 150" stroke="#10B981" stroke-width="2"/>
  <path d="M 270 190 L 305 210" stroke="#818CF8" stroke-width="2"/>

  <!-- Right: Isolated Packages -->
  <g transform="translate(315, 50)">
    <!-- Package 1: Apps -->
    <rect x="0" y="0" width="515" height="55" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow)"/>
    <text x="20" y="24" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">📱 apps/customer_app (Flutter Mobile App)</text>
    <text x="20" y="42" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Root Entrypoint yang menggabungkan seluruh packages internal.</text>

    <!-- Package 2: Core Network & Design -->
    <rect x="0" y="65" width="515" height="55" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1"/>
    <text x="20" y="89" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">📦 packages/core_network &amp; core_ui</text>
    <text x="20" y="107" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Klien HTTP Dio terpusat, Design System (Warna, Typography, Komponen).</text>

    <!-- Package 3: Feature Payment -->
    <rect x="0" y="130" width="515" height="55" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1"/>
    <text x="20" y="154" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold">📦 packages/feature_payment</text>
    <text x="20" y="172" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Modul Pembayaran terisolasi, bisa dikembangkan tim lain secara paralel.</text>
  </g>
</svg>
