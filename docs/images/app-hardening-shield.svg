<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">4 LAPISAN PERTAHANAN KEAMANAN APLIKASI (APP HARDENING SHIELD)</text>

  <!-- Layer 1: Code Obfuscation -->
  <g transform="translate(30, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1. KODE OBFUSCATION</text>

    <!-- Details -->
    <rect x="10" y="45" width="160" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="68" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">--obfuscate</text>
    <text x="90" y="86" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">--split-debug-info</text>
    <text x="90" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Menghilangkan nama</text>
    <text x="90" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">class &amp; method dari</text>
    <text x="90" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">decompiler hacker</text>
    <text x="90" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Anti-Reverse Eng</text>
  </g>

  <!-- Layer 2: Environment Guard -->
  <g transform="translate(230, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="90" y="21" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. ENVIRONMENT GUARD</text>

    <!-- Details -->
    <rect x="10" y="45" width="160" height="135" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="68" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Deteksi Root &amp; Jailbreak</text>
    <text x="90" y="88" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">FLAG_SECURE Active</text>
    <text x="90" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Blokir screenshot &amp;</text>
    <text x="90" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">rekam layar saat app</text>
    <text x="90" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">berada di latar belakang</text>
    <text x="90" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Privacy Shield</text>
  </g>

  <!-- Layer 3: Network Shield (SSL Pinning) -->
  <g transform="translate(430, 55)">
    <rect width="190" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="190" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="95" y="21" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3. SSL PINNING SHIELD</text>

    <!-- Details -->
    <rect x="10" y="45" width="170" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="95" y="68" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">SHA-256 Fingerprint</text>
    <text x="95" y="88" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">SPKI Certificate Hash</text>
    <text x="95" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Blokir serangan MITM</text>
    <text x="95" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">(Man-in-the-Middle)</text>
    <text x="95" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">dari Charles Proxy/Burp</text>
    <text x="95" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Zero Packet Sniffing</text>
  </g>

  <!-- Layer 4: Hardware Keystore Storage -->
  <g transform="translate(640, 55)">
    <rect width="190" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="190" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="95" y="21" fill="#A5B4FC" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4. KEYSTORE ENCRYPTION</text>

    <!-- Details -->
    <rect x="10" y="45" width="170" height="135" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="95" y="68" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Android Keystore</text>
    <text x="95" y="88" fill="#A5B4FC" font-family="monospace" font-size="9" text-anchor="middle">iOS Keychain Vault</text>
    <text x="95" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Enkripsi Hardware</text>
    <text x="95" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">AES-256 GCM untuk</text>
    <text x="95" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Token JWT &amp; PIN Bank</text>
    <text x="95" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Secure Storage</text>
  </g>
</svg>
