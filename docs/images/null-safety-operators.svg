    <text x="75" y="145" fill="#818CF8" font-family="monospace" font-size="10" text-anchor="middle">nama ??= 'Budi'</text>
    <text x="75" y="165" fill="#A5B4FC" font-family="monospace" font-size="9" text-anchor="middle">Hanya assign jika null</text>
