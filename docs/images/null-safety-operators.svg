    <text x="75" y="35" fill="#38BDF8" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">?</text>
    <text x="75" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Nullable Type</text>
    <text x="75" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Boleh bernilai null</text>
    
    <rect x="10" y="120" width="130" height="65" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="75" y="145" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">String? nama;</text>
    <text x="75" y="165" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">(Bisa 'Anton' / null)</text>
  </g>

  <!-- Box 2: ! Null Assertion -->
  <g transform="translate(190, 55)">
    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="75" y="35" fill="#F43F5E" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">!</text>
