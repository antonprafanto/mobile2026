    <text x="75" y="145" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">nama ?? 'Tamu'</text>
    <text x="75" y="165" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">Ganti 'Tamu' jika null</text>
  </g>

