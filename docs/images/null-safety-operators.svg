  <!-- Box 5: ??= Null-Aware Assignment -->
  <g transform="translate(685, 55)">
    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <text x="75" y="35" fill="#818CF8" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">??=</text>
