    <text x="75" y="145" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">user?.cetak()</text>
    <text x="75" y="165" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Lewati jika null</text>
