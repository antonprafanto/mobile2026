  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LIMA OPERATOR SOUND NULL SAFETY DI DART MODERN</text>

  <!-- Box 1: ? Nullable -->
