    <text x="75" y="145" fill="#F43F5E" font-family="monospace" font-size="10" text-anchor="middle">nama!.length</text>
    <text x="75" y="165" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">⚠️ Crash jika null!</text>
  </g>

  <!-- Box 3: ?? If-Null -->
