    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="75" y="35" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">??</text>
