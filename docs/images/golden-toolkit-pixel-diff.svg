<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="0%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">VISUAL REGRESSION TESTING DENGAN GOLDEN TOOLKIT</text>

  <!-- Box 1: Master Golden Baseline -->
  <g transform="translate(30, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. MASTER BASELINE</text>

    <!-- Simulated UI Card Baseline -->
    <rect x="20" y="55" width="180" height="90" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="50" cy="90" r="16" fill="#0284C7"/>
    <text x="50" y="95" fill="#FFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">₿</text>
    <text x="80" y="85" fill="#FFF" font-family="monospace" font-size="10" font-weight="bold">Bitcoin</text>
    <text x="80" y="102" fill="#34D399" font-family="monospace" font-size="9">+4.2%</text>

    <text x="110" y="175" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">goldens/card_master.png</text>
  </g>

  <!-- VS Sign -->
  <text x="275" y="155" fill="#64748B" font-family="monospace" font-size="16" font-weight="bold">VS</text>

  <!-- Box 2: Actual Render -->
  <g transform="translate(310, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="110" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. ACTUAL RENDER</text>

    <!-- Simulated UI Card with unintended shift -->
    <rect x="20" y="55" width="180" height="90" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="45" cy="85" r="14" fill="#B45309"/> <!-- Shifted slightly -->
    <text x="45" y="90" fill="#FFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">₿</text>
    <text x="75" y="82" fill="#FFF" font-family="monospace" font-size="10" font-weight="bold">Bitcoin</text>
    <text x="75" y="98" fill="#F43F5E" font-family="monospace" font-size="9">+4.2%</text>

    <text x="110" y="175" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Headless Canvas Capture</text>
  </g>

  <!-- Comparator Arrow -->
  <path d="M 545 150 L 580 150" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="580,145 590,150 580,155" fill="#F43F5E"/>

  <!-- Box 3: Diff Comparison Output -->
  <g transform="translate(590, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="2" filter="url(#glow)"/>
    <rect width="240" height="32" rx="10" fill="#9F1239" fill-opacity="0.3"/>
    <text x="120" y="21" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. PIXEL DIFF RESULT</text>

    <!-- Diff Visualizer Box -->
    <rect x="20" y="50" width="200" height="85" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <!-- Red highlight box on diff -->
    <rect x="40" y="70" width="40" height="35" fill="#F43F5E" fill-opacity="0.4" stroke="#F43F5E" stroke-dasharray="2,2"/>
    <text x="120" y="85" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">❌ 1.4% Pixel Mismatch</text>
    <text x="120" y="105" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="middle">Padding &amp; Color Changed</text>

    <text x="120" y="165" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">Mencegah UI Rusak ke Prod</text>
  </g>
</svg>
