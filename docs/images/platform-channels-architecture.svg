<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR PLATFORM CHANNELS: JEMBATAN FLUTTER DART KE KOTLIN &amp; SWIFT</text>

  <!-- Layer 1: Flutter Dart Client -->
  <g transform="translate(30, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="115" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FLUTTER (DART LAYER)</text>

    <!-- Channels -->
    <rect x="15" y="48" width="200" height="36" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="115" y="70" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">MethodChannel (RPC Call)</text>

    <rect x="15" y="94" width="200" height="36" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="115" y="116" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">EventChannel (Live Stream)</text>

    <rect x="15" y="140" width="200" height="36" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="115" y="162" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BasicMessage (Raw Bytes)</text>

    <text x="115" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Async Non-Blocking Execution</text>
  </g>

  <!-- Middle: BinaryMessenger Bridge -->
  <g transform="translate(290, 55)">
    <rect width="260" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="260" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="130" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BINARY MESSENGER BRIDGE</text>

    <text x="130" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">StandardMessageCodec</text>

    <rect x="15" y="80" width="230" height="60" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="130" y="102" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">Serialisasi Otomatis:</text>
    <text x="130" y="122" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">int, bool, double, String, List, Map</text>

    <text x="130" y="165" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">⇄ Byte Buffers / IPC ⇄</text>
  </g>

  <!-- Right: Native Platform Host -->
  <g transform="translate(580, 55)">
    <rect width="250" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="250" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="125" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">NATIVE HOST (OS THREAD)</text>

    <!-- Android Card -->
    <rect x="15" y="48" width="220" height="60" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="68" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Android (Kotlin / Java)</text>
    <text x="125" y="86" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">MethodChannel.MethodCallHandler</text>
    <text x="125" y="100" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">BatteryManager / SensorManager</text>

    <!-- iOS Card -->
    <rect x="15" y="118" width="220" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="125" y="138" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">iOS (Swift / Objective-C)</text>
    <text x="125" y="156" fill="#BAE6FD" font-family="monospace" font-size="9" text-anchor="middle">FlutterMethodCallHandler</text>
    <text x="125" y="170" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">UIDevice.current.batteryLevel</text>
  </g>
</svg>
