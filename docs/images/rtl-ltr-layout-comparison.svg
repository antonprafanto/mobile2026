<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">KOMPARASI TATA LETAK: LTR (INDONESIA/ENGLISH) VS RTL (ARABIC)</text>

  <!-- Left: LTR Layout -->
  <g transform="translate(30, 55)">
    <rect width="380" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="190" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LTR (LEFT-TO-RIGHT) — id / en</text>

    <!-- Simulated UI Row -->
    <rect x="20" y="50" width="340" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <!-- Start Icon -->
    <circle cx="45" cy="75" r="14" fill="#0284C7"/>
    <text x="45" y="79" fill="#FFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">✈️</text>
    <!-- Label -->
    <text x="70" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">Tiket Pesawat Garuda</text>
    <text x="70" y="88" fill="#94A3B8" font-family="monospace" font-size="10">Rp 1.450.000 / kursi</text>
    <!-- End Arrow -->
    <text x="335" y="80" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="bold">→</text>

    <text x="190" y="125" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">EdgeInsetsDirectional.only(start: 16, end: 16)</text>
    <text x="190" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">start = Kiri (Left) | end = Kanan (Right)</text>
    <text x="190" y="175" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Alur Baca: Kiri ke Kanan ➔</text>
  </g>

  <!-- Right: RTL Layout -->
  <g transform="translate(450, 55)">
    <rect width="380" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="380" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="190" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RTL (RIGHT-TO-LEFT) — ar (العربية)</text>

    <!-- Simulated UI Row Mirrored -->
    <rect x="20" y="50" width="340" height="50" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <!-- End Arrow on Left -->
    <text x="40" y="80" fill="#34D399" font-family="monospace" font-size="16" font-weight="bold">←</text>
    <!-- Label in Arabic -->
    <text x="290" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="end">تذكرة طيران جارودا</text>
    <text x="290" y="88" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="end">١,٤٥٠,٠٠٠ روبية</text>
    <!-- Start Icon on Right -->
    <circle cx="335" cy="75" r="14" fill="#059669"/>
    <text x="335" y="79" fill="#FFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">✈️</text>

    <text x="190" y="125" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">EdgeInsetsDirectional.only(start: 16, end: 16)</text>
    <text x="190" y="150" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">start = Kanan (Right) | end = Kiri (Left)</text>
    <text x="190" y="175" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Alur Baca: Kanan ke Kiri ➔</text>
  </g>
</svg>
