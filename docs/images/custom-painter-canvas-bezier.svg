<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">RENDERING GRAFIK BEZIER DENGAN CUSTOMPAINTER &amp; CANVAS</text>

  <!-- Left: Code & Concepts -->
  <g transform="translate(30, 55)">
    <rect width="320" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="320" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="160" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. LOGIKA CANVAS.DRAWPATH()</text>

    <!-- Code Snippet -->
    <rect x="15" y="45" width="290" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="68" fill="#FDE047" font-family="monospace" font-size="9">final path = Path();</text>
    <text x="25" y="86" fill="#38BDF8" font-family="monospace" font-size="9">path.moveTo(0, size.height * 0.7);</text>
    <text x="25" y="104" fill="#34D399" font-family="monospace" font-size="9">path.quadraticBezierTo(</text>
    <text x="35" y="122" fill="#A7F3D0" font-family="monospace" font-size="9">  cp.x, cp.y, end.x, end.y);</text>
    <text x="25" y="142" fill="#38BDF8" font-family="monospace" font-size="9">canvas.drawPath(path, paint);</text>
    <text x="25" y="162" fill="#94A3B8" font-family="monospace" font-size="9">shouldRepaint: (old) =&gt; false</text>
  </g>

  <!-- Right: Visual Canvas Coordinate Plane -->
  <g transform="translate(370, 55)">
    <rect width="460" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="460" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="230" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. BIDANG KOORDINAT GRAFIK BEZIER (CANVAS)</text>

    <!-- Grid lines -->
    <line x1="30" y1="90" x2="430" y2="90" stroke="#334155" stroke-dasharray="3,3"/>
    <line x1="30" y1="140" x2="430" y2="140" stroke="#334155" stroke-dasharray="3,3"/>
    <line x1="30" y1="190" x2="430" y2="190" stroke="#334155" stroke-dasharray="3,3"/>

    <!-- Fill Gradient Area under Bezier Curve -->
    <path d="M 30 160 Q 130 60, 230 120 T 430 80 L 430 200 L 30 200 Z" fill="url(#chartGlow)"/>

    <!-- Bezier Stroke Line -->
    <path d="M 30 160 Q 130 60, 230 120 T 430 80" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Control Points & Anchor Dots -->
    <circle cx="30" cy="160" r="5" fill="#38BDF8"/>
    <circle cx="130" cy="60" r="4" fill="#F59E0B"/>
    <text x="130" y="50" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Control Point 1 (x1, y1)</text>

    <circle cx="230" cy="120" r="5" fill="#34D399"/>
    <circle cx="430" cy="80" r="5" fill="#10B981"/>

    <text x="230" y="225" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">⚡ 60 FPS Native GPU Canvas Acceleration</text>
  </g>
</svg>
