<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FUNCTIONAL ERROR HANDLING DENGAN EITHER&lt;FAILURE, SUCCESS&gt; (FPDART)</text>

  <!-- Step 1: Data Layer Exception -->
  <g transform="translate(30, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="90" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. DATA SOURCE</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Eksekusi Jaringan/DB:</text>

    <rect x="10" y="85" width="160" height="40" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="90" y="110" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">Response 200 OK</text>

    <rect x="10" y="135" width="160" height="40" rx="4" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="90" y="160" fill="#FDA4AF" font-family="monospace" font-size="10" text-anchor="middle">DioException / Timeout</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 215 150 L 245 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="245,145 255,150 245,155" fill="#818CF8"/>

  <!-- Step 2: Repository Catch & Wrap -->
  <g transform="translate(255, 55)">
    <rect width="210" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="210" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="105" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. REPOSITORY PATTERN</text>

    <text x="105" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Bungkus ke Tipe Either:</text>

    <rect x="10" y="85" width="190" height="40" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="105" y="110" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Right(AccountBalance)</text>

    <rect x="10" y="135" width="190" height="40" rx="4" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="105" y="160" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Left(ServerFailure)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 470 150 L 500 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="500,145 510,150 500,155" fill="#10B981"/>

  <!-- Step 3: Use Case & UI Consumption -->
  <g transform="translate(510, 55)">
    <rect width="320" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="320" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="160" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. USE CASE &amp; BLOC FOLD()</text>

    <text x="160" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Pattern Matching Tanpa Try/Catch:</text>

    <rect x="15" y="80" width="290" height="95" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="102" fill="#A5B4FC" font-family="monospace" font-size="9">final result = await getBalance();</text>
    <text x="25" y="122" fill="#FDE047" font-family="monospace" font-size="9">result.fold(</text>
    <text x="35" y="142" fill="#FDA4AF" font-family="monospace" font-size="9">  (failure) =&gt; emit(BalanceError(failure)),</text>
    <text x="35" y="162" fill="#34D399" font-family="monospace" font-size="9">  (balance) =&gt; emit(BalanceLoaded(balance)),</text>
    <text x="25" y="180" fill="#FDE047" font-family="monospace" font-size="9">);</text>
  </g>
</svg>
