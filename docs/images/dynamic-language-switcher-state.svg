<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ALUR GANTI BAHASA DINAMIS DI DALAM APLIKASI (IN-APP LANGUAGE SWITCHING)</text>

  <!-- Step 1: User Selection UI -->
  <g transform="translate(30, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="115" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. USER SELECT LOCALE</text>

    <!-- Language Selector Dropdown Mock -->
    <rect x="15" y="45" width="200" height="34" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="67" fill="#38BDF8" font-family="monospace" font-size="10">🇮🇩 Bahasa Indonesia</text>

    <rect x="15" y="85" width="200" height="34" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="25" y="107" fill="#34D399" font-family="monospace" font-size="10">🇺🇸 English (US)</text>

    <rect x="15" y="125" width="200" height="34" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="147" fill="#FDE047" font-family="monospace" font-size="10">🇸🇦 العربية (Arabic RTL)</text>

    <text x="115" y="180" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Dropdown / Settings Action</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 270 150 L 305 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="305,145 315,150 305,155" fill="#818CF8"/>

  <!-- Step 2: Language State Manager -->
  <g transform="translate(315, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. LOCALE STATE CUBIT</text>

    <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Emit Perubahan State:</text>

    <rect x="15" y="80" width="190" height="75" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="25" y="102" fill="#FDE047" font-family="monospace" font-size="9">emit(Locale('ar'));</text>
    <text x="25" y="122" fill="#A7F3D0" font-family="monospace" font-size="9">prefs.setString(</text>
    <text x="35" y="140" fill="#34D399" font-family="monospace" font-size="9">  'lang', 'ar');</text>

    <text x="110" y="180" fill="#A5B4FC" font-family="monospace" font-size="9" text-anchor="middle">Persist di Shared Preferences</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 545 150 L 580 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="580,145 590,150 580,155" fill="#10B981"/>

  <!-- Step 3: MaterialApp Re-render -->
  <g transform="translate(590, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="240" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. MATERIALAPP REBUILD</text>

    <rect x="15" y="45" width="210" height="110" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" fill="#38BDF8" font-family="monospace" font-size="9">MaterialApp(</text>
    <text x="35" y="86" fill="#FDE047" font-family="monospace" font-size="9">  locale: currentLocale,</text>
    <text x="35" y="104" fill="#34D399" font-family="monospace" font-size="9">  localizationsDelegates,</text>
    <text x="35" y="122" fill="#34D399" font-family="monospace" font-size="9">  supportedLocales,</text>
    <text x="25" y="142" fill="#38BDF8" font-family="monospace" font-size="9">)</text>

    <text x="120" y="180" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">⚡ Rebuild Instan Tanpa Restart App</text>
  </g>
</svg>
