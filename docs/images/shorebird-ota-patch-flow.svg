<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR SHOREBIRD OVER-THE-AIR (OTA) CODEPUSH UNTUK FLUTTER</text>

  <!-- Step 1: Developer Hotfix -->
  <g transform="translate(30, 55)">
    <rect width="220" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="110" y="21" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1. BUGFIX PRODUCTION</text>

    <!-- Code Block -->
    <rect x="10" y="45" width="200" height="135" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="68" fill="#FDA4AF" font-family="monospace" font-size="9">Bug: Tombol Checkout Crash!</text>
    <text x="20" y="92" fill="#34D399" font-family="monospace" font-size="9">Fix: Perbaiki Null-Check</text>
    <text x="20" y="118" fill="#F8FAFC" font-family="monospace" font-size="9">Command:</text>
    <text x="20" y="136" fill="#38BDF8" font-family="monospace" font-size="8">shorebird patch android</text>
    <text x="20" y="152" fill="#FDE047" font-family="monospace" font-size="8">--release-version 1.2.0</text>
    <text x="20" y="172" fill="#A7F3D0" font-family="monospace" font-size="8">⚡ Hitung Bytecode Diff ~40KB</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 260 150 L 290 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="290,145 300,150 290,155" fill="#818CF8"/>

  <!-- Step 2: Shorebird Cloud CDN -->
  <g transform="translate(300, 55)">
    <rect width="250" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="125" y="21" fill="#A5B4FC" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. SHOREBIRD CLOUD CDN</text>

    <!-- Details -->
    <rect x="15" y="45" width="220" height="135" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="125" y="70" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Global Edge CDN</text>
    <text x="125" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Distribusi Instan ke Seluruh Dunia</text>
    <text x="125" y="118" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Tanpa Review Store (48 Jam)!</text>
    <text x="125" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Patuh Kebijakan Apple &amp; Google</text>
    <text x="125" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Zero Store Downtime</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 560 150 L 590 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="590,145 600,150 590,155" fill="#10B981"/>

  <!-- Step 3: User Device Instant Patch -->
  <g transform="translate(600, 55)">
    <rect width="230" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="230" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3. USER DEVICE SEAMLESS</text>

    <!-- Details -->
    <rect x="15" y="45" width="200" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="70" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">📱 Background Download</text>
    <text x="115" y="92" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">Ukuran Patch: 42 KB</text>
    <text x="115" y="118" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Next App Launch: FIX! 🎉</text>
    <text x="115" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Pengguna tidak perlu unduh ulang</text>
    <text x="115" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ 100% Seamless UX</text>
  </g>
