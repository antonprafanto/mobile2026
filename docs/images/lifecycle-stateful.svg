<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="buildGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="disposeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="600" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- TITLE -->
  <text x="420" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DIAGRAM SIKLUS HIDUP (STATEFULWIDGET LIFECYCLE)</text>

  <!-- Left Loop Line (setState & didUpdateWidget -> build) -->
  <path d="M 120 375 L 70 375 L 70 255 L 120 255" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="120,250 130,255 120,260" fill="#F59E0B"/>
  <text x="65" y="315" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="end">Re-Render Loop</text>

  <path d="M 120 315 L 70 315" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Nodes Flow Center X = 230 -->
  <!-- 1. createState -->
  <g transform="translate(130, 60)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="100" y="26" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">createState()</text>
    <text x="220" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Dipanggil saat widget pertama kali dibuat</text>
  </g>
  <line x1="230" y1="102" x2="230" y2="120" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="226,120 230,126 234,120" fill="#38BDF8"/>

  <!-- 2. initState -->
  <g transform="translate(130, 126)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="100" y="26" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">initState()</text>
    <text x="220" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Inisialisasi controller, timer, &amp; stream (1x saja)</text>
  </g>
  <line x1="230" y1="168" x2="230" y2="186" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="226,186 230,192 234,186" fill="#38BDF8"/>

  <!-- 3. didChangeDependencies -->
  <g transform="translate(130, 192)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#818CF8" stroke-width="1.5"/>
    <text x="100" y="26" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">didChangeDependencies()</text>
    <text x="220" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Dipanggil saat Theme, Locale, / InheritedWidget berubah</text>
  </g>
  <line x1="230" y1="234" x2="230" y2="252" stroke="#818CF8" stroke-width="2"/>
  <polygon points="226,252 230,258 234,252" fill="#818CF8"/>

  <!-- 4. build (HIGHLIGHTED) -->
  <g transform="translate(130, 258)">
    <rect width="200" height="48" rx="8" fill="url(#buildGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="30" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">build()</text>
    <text x="220" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">➔ Merender pohon widget (Dipanggil saat setState/update)</text>
  </g>
  <line x1="230" y1="306" x2="230" y2="324" stroke="#818CF8" stroke-width="2"/>
  <polygon points="226,324 230,330 234,324" fill="#818CF8"/>

  <!-- 5. didUpdateWidget -->
  <g transform="translate(130, 330)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="26" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">didUpdateWidget()</text>
    <text x="220" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Dipanggil saat widget induk mengirim data baru</text>
  </g>
  <line x1="230" y1="372" x2="230" y2="390" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="226,390 230,396 234,390" fill="#F59E0B"/>

  <!-- 6. setState -->
  <g transform="translate(130, 396)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="26" fill="#F59E0B" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">setState()</text>
    <text x="220" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Memberitahu framework untuk memanggil build() ulang</text>
  </g>
  <line x1="230" y1="438" x2="230" y2="456" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="226,456 230,462 234,456" fill="#94A3B8"/>

  <!-- 7. deactivate -->
  <g transform="translate(130, 462)">
    <rect width="200" height="42" rx="8" fill="url(#nodeBlue)" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="100" y="26" fill="#94A3B8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">deactivate()</text>
    <text x="220" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">➔ Widget dilepas sementara dari pohon</text>
  </g>
  <line x1="230" y1="504" x2="230" y2="522" stroke="#F43F5E" stroke-width="2"/>
  <polygon points="226,522 230,528 234,522" fill="#F43F5E"/>

  <!-- 8. dispose (CLEANUP) -->
  <g transform="translate(130, 528)">
    <rect width="200" height="42" rx="8" fill="url(#disposeGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="100" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">dispose()</text>
    <text x="220" y="26" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">➔ Wajib menutup Controller, Animation, &amp; Stream! 🛑</text>
  </g>
</svg>
