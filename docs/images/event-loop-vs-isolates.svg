<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR CONCURRENCY DART: EVENT LOOP (UI) VS BACKGROUND ISOLATES</text>

  <!-- Left: Main Isolate (UI Thread) -->
  <g transform="translate(30, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="34" rx="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MAIN ISOLATE (UI &amp; EVENT LOOP)</text>

    <!-- Microtask Queue -->
    <rect x="20" y="48" width="340" height="42" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="35" y="73" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold">1. Microtask Queue</text>
    <text x="210" y="73" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Prioritas Sangat Tinggi (Internal)</text>

    <!-- Event Queue -->
    <rect x="20" y="98" width="340" height="42" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="35" y="123" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">2. Event Queue</text>
    <text x="210" y="123" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">I/O, Future, Klik UI, Timer</text>

    <text x="190" y="165" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ Single-Threaded: Tetap Mulus 120 FPS</text>
    <text x="190" y="185" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">⚠️ Jika diberi komputasi berat, UI akan jank/freeze!</text>
  </g>

  <!-- Right: Worker Isolate (Multi-Threading) -->
  <g transform="translate(450, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="380" height="34" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BACKGROUND WORKER ISOLATE (THREAD TERPISAH)</text>

    <rect x="20" y="48" width="340" height="42" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="35" y="73" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="bold">Isolate.run() / Isolate.spawn()</text>

    <text x="190" y="115" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Berjalan di Core CPU Terpisah &amp; Memori Terisolasi</text>

    <!-- Communication Ports -->
    <rect x="20" y="135" width="340" height="55" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="190" y="157" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SendPort ⇄ ReceivePort</text>
    <text x="190" y="177" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Komunikasi pesan antar thread tanpa race condition</text>
  </g>
</svg>
