<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MATRIKS OTOMATISASI RILIS DENGAN FASTLANE (FASTFILE LANES)</text>

  <!-- Left: Android Fastlane Lane -->
  <g transform="translate(30, 55)">
    <rect width="380" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="380" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="190" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🤖 ANDROID LANE: fastlane android beta</text>

    <!-- Code Box -->
    <rect x="15" y="45" width="350" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" fill="#F8FAFC" font-family="monospace" font-size="9">lane :beta do</text>
    <text x="35" y="88" fill="#38BDF8" font-family="monospace" font-size="9">  gradle(task: 'bundleRelease')</text>
    <text x="35" y="108" fill="#FDE047" font-family="monospace" font-size="9">  upload_to_play_store(</text>
    <text x="45" y="126" fill="#34D399" font-family="monospace" font-size="9">    track: 'internal',</text>
    <text x="45" y="144" fill="#34D399" font-family="monospace" font-size="9">    json_key: 'play-store-key.json')</text>
    <text x="25" y="165" fill="#F8FAFC" font-family="monospace" font-size="9">end</text>
  </g>

  <!-- Right: iOS Fastlane Lane -->
  <g transform="translate(450, 55)">
    <rect width="380" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="190" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🍎 IOS LANE: fastlane ios beta</text>

    <!-- Code Box -->
    <rect x="15" y="45" width="350" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="68" fill="#F8FAFC" font-family="monospace" font-size="9">lane :beta do</text>
    <text x="35" y="88" fill="#38BDF8" font-family="monospace" font-size="9">  match(type: 'appstore', readonly: true)</text>
    <text x="35" y="108" fill="#FDE047" font-family="monospace" font-size="9">  build_app(scheme: 'Runner')</text>
    <text x="35" y="128" fill="#A5B4FC" font-family="monospace" font-size="9">  upload_to_testflight(</text>
    <text x="45" y="146" fill="#34D399" font-family="monospace" font-size="9">    skip_waiting_for_build_processing: true)</text>
    <text x="25" y="165" fill="#F8FAFC" font-family="monospace" font-size="9">end</text>
  </g>
</svg>
