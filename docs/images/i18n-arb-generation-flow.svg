<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE LOKALISASI FLUTTER: BERKAS ARB KE APPLOCALIZATIONS TYPE-SAFE</text>

  <!-- Step 1: ARB Resource Files -->
  <g transform="translate(30, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="120" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. BERKAS ARB (JSON)</text>

    <!-- ARB Cards -->
    <rect x="15" y="45" width="210" height="36" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="67" fill="#38BDF8" font-family="monospace" font-size="10">📄 app_id.arb (Bahasa Indonesia)</text>

    <rect x="15" y="88" width="210" height="36" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="25" y="110" fill="#34D399" font-family="monospace" font-size="10">📄 app_en.arb (English Global)</text>

    <rect x="15" y="131" width="210" height="36" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="153" fill="#FDE047" font-family="monospace" font-size="10">📄 app_ar.arb (العربية RTL)</text>

    <text x="120" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Placeholder, Pluralization, &amp; Gender</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 285 150 L 315 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="315,145 325,150 315,155" fill="#818CF8"/>

  <!-- Step 2: flutter gen-l10n Compiler -->
  <g transform="translate(325, 55)">
    <rect width="210" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="210" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="105" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. FLUTTER GEN-L10N</text>

    <text x="105" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Kompilasi Otomatis:</text>

    <rect x="15" y="80" width="180" height="60" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="105" y="102" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">l10n.yaml Config</text>
    <text x="105" y="122" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Code Generation</text>

    <text x="105" y="165" fill="#A5B4FC" font-family="monospace" font-size="10" text-anchor="middle">⚡ Bebas Salah Ketik</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 550 150 L 580 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="580,145 590,150 580,155" fill="#10B981"/>

  <!-- Step 3: Type-Safe Widget Consumption -->
  <g transform="translate(590, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="240" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. KONSUMSI TYPE-SAFE</text>

    <rect x="15" y="45" width="210" height="110" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" fill="#FDE047" font-family="monospace" font-size="9">final l10n =</text>
    <text x="25" y="86" fill="#38BDF8" font-family="monospace" font-size="9">  AppLocalizations.of(context)!;</text>
    <text x="25" y="112" fill="#A7F3D0" font-family="monospace" font-size="9">Text(l10n.welcomeUser('Budi'))</text>
    <text x="25" y="132" fill="#34D399" font-family="monospace" font-size="9">Text(l10n.itemCount(5))</text>

    <text x="120" y="180" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Otomatis Terganti Saat Ganti Locale</text>
  </g>
</svg>
