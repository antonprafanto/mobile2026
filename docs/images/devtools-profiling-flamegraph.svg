<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PROFILING PERFORMA &amp; DEVTOOLS FLAMEGRAPH (60 FPS / 16.6MS TARGET)</text>

  <!-- Left: Frame Rendering Timeline Chart -->
  <g transform="translate(30, 55)">
    <rect width="440" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="440" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="220" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. FRAME RENDERING TIMELINE (UI &amp; RASTER)</text>

    <!-- 16.6ms Target Threshold Line -->
    <line x1="20" y1="120" x2="420" y2="120" stroke="#F59E0B" stroke-dasharray="4,4" stroke-width="1.5"/>
    <text x="350" y="115" fill="#FDE047" font-family="monospace" font-size="9">16.6ms (60 FPS Line)</text>

    <!-- Frame Bars -->
    <!-- Frame 1 (Good: 8ms) -->
    <rect x="50" y="145" width="25" height="40" rx="3" fill="#10B981"/>
    <!-- Frame 2 (Good: 11ms) -->
    <rect x="90" y="130" width="25" height="55" rx="3" fill="#10B981"/>
    <!-- Frame 3 (Good: 7ms) -->
    <rect x="130" y="150" width="25" height="35" rx="3" fill="#10B981"/>
    <!-- Frame 4 (JANKY RED: 32ms!) -->
    <rect x="170" y="65" width="25" height="120" rx="3" fill="#F43F5E" stroke="#FECDD3" stroke-width="1" filter="url(#glow)"/>
    <text x="182" y="58" fill="#FDA4AF" font-family="monospace" font-size="8" text-anchor="middle">32ms JANK</text>
    <!-- Frame 5 (Good: 10ms) -->
    <rect x="210" y="135" width="25" height="50" rx="3" fill="#10B981"/>
    <!-- Frame 6 (Good: 9ms) -->
    <rect x="250" y="140" width="25" height="45" rx="3" fill="#10B981"/>

    <text x="220" y="215" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">UI Thread (Dart Code) vs Raster Thread (GPU Engine)</text>
  </g>

  <!-- Right: CPU Flamegraph & Memory Profiler -->
  <g transform="translate(490, 55)">
    <rect width="340" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
    <rect width="340" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="170" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. CPU PROFILER &amp; MEMORY LEAKS</text>

    <!-- Flamegraph Blocks -->
    <rect x="20" y="50" width="300" height="24" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="170" y="66" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">build() -&gt; CryptoDashboard</text>

    <rect x="35" y="78" width="180" height="22" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <text x="125" y="93" fill="#FFF" font-family="monospace" font-size="8" text-anchor="middle">LiveBézierPainter.paint()</text>

    <rect x="225" y="78" width="85" height="22" rx="4" fill="#059669" stroke="#10B981" stroke-width="1"/>
    <text x="267" y="93" fill="#FFF" font-family="monospace" font-size="8" text-anchor="middle">Stream.map</text>

    <!-- Memory Stats -->
    <rect x="20" y="112" width="300" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="30" y="130" fill="#FDE047" font-family="monospace" font-size="9">Heap Alloc: 42.4 MB (Stable)</text>
    <text x="30" y="148" fill="#34D399" font-family="monospace" font-size="9">0 Memory Leaks | 0 Unhandled Closures</text>

    <text x="170" y="180" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">⚡ DevTools Profiling Ready</text>
  </g>
</svg>
