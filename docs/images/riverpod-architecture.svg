<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR RIVERPOD 2.0+ &amp; ASYNCVALUE DATA FLOW</text>

  <!-- Step 1: Provider Definition -->
  <g transform="translate(30, 50)">
    <rect width="230" height="200" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="115" y="21" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1. @riverpod Notifier</text>

    <text x="15" y="60" fill="#E2E8F0" font-family="monospace" font-size="11">@riverpod</text>
    <text x="15" y="80" fill="#E2E8F0" font-family="monospace" font-size="11">class ProdukNotifier</text>
    <text x="15" y="100" fill="#93C5FD" font-family="monospace" font-size="11">  extends _$ProdukNotifier {</text>
    <text x="25" y="125" fill="#38BDF8" font-family="monospace" font-size="11">  Future&lt;List&gt; build() {</text>
    <text x="35" y="145" fill="#FDE047" font-family="monospace" font-size="11">    return fetchAPI();</text>
    <text x="25" y="165" fill="#38BDF8" font-family="monospace" font-size="11">  }</text>
    <text x="15" y="185" fill="#93C5FD" font-family="monospace" font-size="11">}</text>
  </g>

  <!-- Arrow 1: Watch/Read -->
  <g transform="translate(265, 120)">
    <path d="M 0 10 L 40 10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="40,5 50,10 40,15" fill="#38BDF8"/>
    <text x="25" y="-5" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ref.watch()</text>
  </g>

  <!-- Step 2: AsyncValue State Container -->
  <g transform="translate(320, 50)">
    <rect width="220" height="200" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#818CF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2. AsyncValue&lt;T&gt;</text>

    <!-- 3 States -->
    <rect x="15" y="45" width="190" height="40" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="110" y="70" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">data: (items) ➔ UI</text>

    <rect x="15" y="95" width="190" height="40" rx="6" fill="#B45309" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
    <text x="110" y="120" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">loading: () ➔ Shimmer</text>

    <rect x="15" y="145" width="190" height="40" rx="6" fill="#881337" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1"/>
    <text x="110" y="170" fill="#FDA4AF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">error: (err, st) ➔ Alert</text>
  </g>

  <!-- Arrow 2: UI Rebuild -->
  <g transform="translate(545, 120)">
    <path d="M 0 10 L 40 10" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="40,5 50,10 40,15" fill="#10B981"/>
    <text x="25" y="-5" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">.when()</text>
  </g>

  <!-- Step 3: ConsumerWidget UI -->
  <g transform="translate(600, 50)">
    <rect width="230" height="200" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="230" height="32" rx="10" fill="#059669" fill-opacity="0.2"/>
    <text x="115" y="21" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3. ConsumerWidget (UI)</text>

    <text x="15" y="60" fill="#E2E8F0" font-family="monospace" font-size="11">Widget build(ref) {</text>
    <text x="25" y="85" fill="#93C5FD" font-family="monospace" font-size="11">  final asyncData =</text>
    <text x="35" y="105" fill="#38BDF8" font-family="monospace" font-size="11">    ref.watch(provider);</text>
    <text x="25" y="130" fill="#E2E8F0" font-family="monospace" font-size="11">  return asyncData.when(</text>
    <text x="35" y="150" fill="#34D399" font-family="monospace" font-size="11">    data: (d) => ListView(),</text>
    <text x="35" y="170" fill="#FDE047" font-family="monospace" font-size="11">    loading: () => Spinner(),</text>
    <text x="25" y="190" fill="#E2E8F0" font-family="monospace" font-size="11">  );</text>
  </g>
</svg>
