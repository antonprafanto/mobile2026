<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ALUR OFFLINE SYNC QUEUE: EKSEKUSI FIFO &amp; AUTO-RETRY</text>

  <!-- Step 1: User Offline Action -->
  <g transform="translate(30, 55)">
    <rect width="170" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="85" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. Aksi Offline</text>

    <text x="85" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Pengguna membuat</text>
    <text x="85" y="85" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Catatan Baru 📝</text>
    <text x="85" y="110" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Koneksi Internet Mati)</text>
    
    <rect x="10" y="135" width="150" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="85" y="155" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">UI Update: 0ms</text>
    <text x="85" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Langsung tampil di layar</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 150 L 235 150" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="235,145 245,150 235,155" fill="#F59E0B"/>

  <!-- Step 2: Write to Local DB & Queue -->
  <g transform="translate(250, 55)">
    <rect width="175" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="175" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="87" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. Simpan ke Drift</text>

    <text x="15" y="65" fill="#E2E8F0" font-family="monospace" font-size="10">Tabel Notes:</text>
    <text x="15" y="85" fill="#FDE047" font-family="monospace" font-size="10">status: "PENDING"</text>
    
    <text x="15" y="120" fill="#E2E8F0" font-family="monospace" font-size="10">Tabel SyncQueue:</text>
    <text x="15" y="140" fill="#38BDF8" font-family="monospace" font-size="10">id: 1, action: "CREATE"</text>
    <text x="15" y="160" fill="#94A3B8" font-family="monospace" font-size="9">payload: {title: ...}</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 430 150 L 460 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="460,145 470,150 460,155" fill="#818CF8"/>

  <!-- Step 3: Network Reconnected & Flush Queue -->
  <g transform="translate(475, 55)">
    <rect width="175" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="175" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="87" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. Engine Sync</text>

    <text x="87" y="65" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📶 Online Kembali</text>
    <text x="87" y="90" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Mengeksekusi antrean</text>
    <text x="87" y="110" fill="#818CF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FIFO secara berurutan</text>
    
    <rect x="10" y="135" width="155" height="45" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="87" y="155" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">POST /api/notes</text>
    <text x="87" y="170" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">Response: 201 Created</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 655 150 L 685 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="685,145 695,150 685,155" fill="#10B981"/>

  <!-- Step 4: Status Synced -->
  <g transform="translate(700, 55)">
    <rect width="130" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="130" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="65" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4. SYNCED</text>

    <text x="65" y="65" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">✅ Tersinkron</text>
    <text x="65" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Hapus item dari</text>
    <text x="65" y="115" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">SyncQueue</text>
    <text x="65" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Update status lokal</text>
    <text x="65" y="165" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">"SYNCED"</text>
  </g>
</svg>
