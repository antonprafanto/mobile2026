<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE OTOMATISASI CI/CD DENGAN GITHUB ACTIONS</text>

  <!-- Stage 1: Trigger -->
  <g transform="translate(30, 55)">
    <rect width="160" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="160" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="80" y="21" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1. GIT TRIGGER</text>

    <!-- Details -->
    <rect x="10" y="45" width="140" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="80" y="70" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">on: push / pull_request</text>
    <text x="80" y="90" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">branch: [main, staging]</text>
    <text x="80" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Deteksi otomatis</text>
    <text x="80" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">commit baru dari</text>
    <text x="80" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">tim pengembang</text>
    <text x="80" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">⚡ Webhook Event</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 195 150 L 225 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="225,145 235,150 225,155" fill="#818CF8"/>

  <!-- Stage 2: Quality Gate -->
  <g transform="translate(235, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#A5B4FC" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. QUALITY GATE</text>

    <!-- Details -->
    <rect x="10" y="45" width="160" height="135" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="90" y="68" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">flutter analyze</text>
    <text x="90" y="86" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">dart format --set-exit</text>
    <text x="90" y="106" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">flutter test --coverage</text>
    <text x="90" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Memastikan 0 error</text>
    <text x="90" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">dan coverage &gt; 85%</text>
    <text x="90" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Tests Passed</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 150 L 450 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="450,145 460,150 450,155" fill="#10B981"/>

  <!-- Stage 3: Build & Sign -->
  <g transform="translate(455, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="180" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="90" y="21" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3. BUILD &amp; SIGN</text>

    <!-- Details -->
    <rect x="10" y="45" width="160" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="68" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">build appbundle (AAB)</text>
    <text x="90" y="86" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">build ipa (iOS)</text>
    <text x="90" y="108" fill="#FDE047" font-family="monospace" font-size="8" text-anchor="middle">Gunakan GitHub Secrets</text>
    <text x="90" y="122" fill="#FDE047" font-family="monospace" font-size="8" text-anchor="middle">KEYSTORE_BASE64 &amp; PIN</text>
    <text x="90" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Obfuscation Active</text>
    <text x="90" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Signed Artifact</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 640 150 L 670 150" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="670,145 680,150 670,155" fill="#F59E0B"/>

  <!-- Stage 4: Deploy Stores -->
  <g transform="translate(675, 55)">
    <rect width="155" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="155" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="77" y="21" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4. DEPLOY</text>

    <!-- Details -->
    <rect x="8" y="45" width="139" height="135" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="77" y="70" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">Google Play Track</text>
    <text x="77" y="90" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">Apple TestFlight</text>
    <text x="77" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Distribusi otomatis</text>
    <text x="77" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">ke QA / User Beta</text>
    <text x="77" y="168" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">🚀 Auto Release</text>
  </g>
</svg>
