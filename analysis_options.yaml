# Aturan "polisi kode" (linter) untuk seluruh contoh aplikasi Flutter.
# Folder berisi program Dart murni punya analysis_options.yaml sendiri
# yang mengizinkan print().
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Contoh jawaban dosen Pertemuan 14-16 (lokal, tidak diunggah)
    # berisi berkas tes yang mengimpor proyek lain (package:kas_kelas,
    # package:tugas_kuliahku, package:latihan_p15, package:latihan_p16,
    # dst.), sehingga hanya bisa diperiksa di proyeknya masing-masing.
    - _internal_dosen/pertemuan_14/solusi/**
    - _internal_dosen/pertemuan_15/solusi/**
    - _internal_dosen/pertemuan_16/solusi/**
    - _internal_dosen/pertemuan_16/pembuktian/**
