<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="180" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Card 1: BUILD -->
  <g transform="translate(20, 25)">
    <rect width="155" height="130" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="77" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. BUILD</text>
    <text x="77" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Widget Tree</text>
    <text x="77" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">menjadi</text>
    <text x="77" y="110" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Element Tree</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 185 90 L 205 90" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>
  <polygon points="205,85 215,90 205,95" fill="#00F2FE" filter="url(#glow)"/>

  <!-- Card 2: LAYOUT -->
  <g transform="translate(225, 25)">
    <rect width="155" height="130" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="12" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="77" y="24" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. LAYOUT</text>
    <text x="77" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Constraints Down</text>
    <text x="77" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">&amp;</text>
    <text x="77" y="112" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sizes Up</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 390 90 L 410 90" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="410,85 420,90 410,95" fill="#818CF8"/>

  <!-- Card 3: PAINT -->
  <g transform="translate(430, 25)">
    <rect width="155" height="130" rx="12" fill="url(#cardGrad)" stroke="#C084FC" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="12" fill="#9333EA" fill-opacity="0.2"/>
    <text x="77" y="24" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. PAINT</text>
    <text x="77" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Canvas API</text>
    <text x="77" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Merekam instruksi</text>
    <text x="77" y="112" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Visual Paint</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 595 90 L 615 90" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="615,85 625,90 615,95" fill="#C084FC"/>

  <!-- Card 4: COMPOSITING -->
  <g transform="translate(635, 25)">
    <rect width="145" height="130" rx="12" fill="url(#cardGrad)" stroke="#F472B6" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="36" rx="12" fill="#DB2777" fill-opacity="0.2"/>
    <text x="72" y="24" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. COMPOSITE</text>
    <text x="72" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Layer Tree</text>
    <text x="72" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Menggabungkan</text>
    <text x="72" y="112" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Lapisan Layer</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 790 90 L 805 90" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="805,85 815,90 805,95" fill="#34D399"/>

  <!-- Card 5: RASTERIZE -->
  <g transform="translate(820, 25)">
    <rect width="100" height="130" rx="12" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="36" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="50" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. RASTER</text>
    <text x="50" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GPU</text>
    <text x="50" y="90" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Impeller</text>
    <text x="50" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">ke Pixel HP</text>
  </g>
</svg>
