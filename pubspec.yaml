# ---------------------------------------------------------------------
# Berkas ini BUKAN untuk menjalankan aplikasi.
# Fungsinya hanya agar seluruh contoh kode di repositori ini dapat
# diperiksa sekaligus (dart format & flutter analyze), baik oleh
# GitHub Actions maupun oleh Anda di VS Code setelah `flutter pub get`.
# ---------------------------------------------------------------------
name: ppb_mobile2026
description: "Materi kuliah Pemrograman Piranti Bergerak (Flutter 2026)."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Dipakai contoh navigasi mulai Pertemuan 6. Versi 17 dipilih karena
  # masih memakai package:flutter/material.dart, sama seperti templat
  # flutter create pada Flutter 3.47 (penjelasan: modul Pertemuan 6).
  go_router: ^17.5.0
  # Dipakai contoh manajemen state (ChangeNotifier + MVVM) mulai
  # Pertemuan 9.
  provider: ^6.1.5
  # Dipakai contoh REST API (permintaan HTTP dan MockClient) mulai
  # Pertemuan 10.
  http: ^1.6.0
  # Dipakai contoh penyimpanan lokal mulai Pertemuan 11: pasangan
  # kunci-nilai (shared_preferences) dan SQLite (sqflite). Paket
  # sqflite_common_ffi_web membuat sqflite bisa berjalan di Chrome.
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.2.0
  # Dipakai contoh fitur perangkat mulai Pertemuan 13: foto dari galeri
  # dan kamera (image_picker) serta lokasi (geolocator). Paket
  # url_launcher (membuka Google Maps) dipakai jobsheet Pertemuan 13.
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  lints: ^6.1.0
