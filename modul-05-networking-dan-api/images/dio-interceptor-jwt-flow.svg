<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ALUR SILENT TOKEN REFRESH DENGAN DIO INTERCEPTOR (JWT 401 RETRY)</text>

  <!-- Step 1: UI Request -->
  <g transform="translate(30, 55)">
    <rect width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="85" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Request API</text>
    <text x="85" y="55" fill="#F8FAFC" font-family="monospace" font-size="11" text-anchor="middle">GET /profil-user</text>
    <text x="85" y="78" fill="#FDA4AF" font-family="monospace" font-size="10" text-anchor="middle">(Token Kedaluwarsa)</text>
  </g>

  <!-- Arrow 1: To Server -->
  <path d="M 200 110 L 230 110" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="230,105 240,110 230,115" fill="#38BDF8"/>

  <!-- Step 2: Server Returns 401 -->
  <g transform="translate(240, 55)">
    <rect width="170" height="110" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="85" y="24" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Server Menolak</text>
    <text x="85" y="55" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">HTTP 401</text>
    <text x="85" y="78" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Unauthorized Error</text>
  </g>

  <!-- Arrow 2: Intercepts -->
  <path d="M 410 110 L 440 110" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="440,105 450,110 440,115" fill="#F59E0B"/>

  <!-- Step 3: Dio Interceptor Catches -->
  <g transform="translate(450, 55)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#glow)"/>
    <text x="90" y="24" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Dio onError Handler</text>
    <text x="90" y="55" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">Kunci Request &amp; Panggil</text>
    <text x="90" y="75" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST /auth/refresh</text>
    <text x="90" y="95" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">(Dapat Token Baru)</text>
  </g>

  <!-- Arrow 3: Retry -->
  <path d="M 630 110 L 660 110" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="660,105 670,110 660,115" fill="#10B981"/>

  <!-- Step 4: Retry Original Request -->
  <g transform="translate(670, 55)">
    <rect width="160" height="110" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="80" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Auto-Retry Request</text>
    <text x="80" y="55" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">HTTP 200 OK</text>
    <text x="80" y="78" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Data Berhasil Diambil!</text>
  </g>

  <!-- Bottom Benefit Note -->
  <g transform="translate(30, 190)">
    <rect width="800" height="105" rx="10" fill="#047857" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <text x="400" y="32" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✨ KEUNGGULAN SILENT REFRESH BAGI USER EXPERIENCE (UX)</text>
    <text x="400" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Pengguna TIDAK AKAN PERNAH dikeluarkan paksa ke layar Login saat sesi token habis di tengah aktivitas.</text>
    <text x="400" y="82" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Dio Interceptor memperbarui token di latar belakang secara transparan tanpa mengganggu interaksi UI.</text>
  </g>
</svg>
