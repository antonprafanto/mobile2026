<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PERBANDINGAN HTTP CLIENT: HTTP PACKAGE VS DIO (STANDAR INDUSTRI)</text>

  <!-- Left: Standard http package -->
  <g transform="translate(30, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#64748B" stroke-width="1.5"/>
    <rect width="380" height="34" rx="12" fill="#334155" fill-opacity="0.4"/>
    <text x="190" y="23" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HTTP PACKAGE (BAWAAN DASAR)</text>

    <text x="20" y="65" fill="#FDA4AF" font-family="monospace" font-size="12">❌ Tidak ada Interceptors</text>
    <text x="20" y="90" fill="#FDA4AF" font-family="monospace" font-size="12">❌ Tidak ada Cancel Token (Abort)</text>
    <text x="20" y="115" fill="#FDA4AF" font-family="monospace" font-size="12">❌ Tidak ada Progress Tracking Upload</text>
    <text x="20" y="140" fill="#FDA4AF" font-family="monospace" font-size="12">❌ Konfigurasi Timeout Manual</text>
    <text x="20" y="165" fill="#94A3B8" font-family="monospace" font-size="12">⚠️ Harus JSON.decode manual setiap kali</text>
    <text x="190" y="195" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Hanya cocok untuk script pengujian kecil</text>
  </g>

  <!-- Right: Dio Client -->
  <g transform="translate(450, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="380" height="34" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DIO CLIENT (ENTERPRISE STANDARD)</text>

    <text x="20" y="65" fill="#34D399" font-family="monospace" font-size="12">✅ Interceptors (Auto Token &amp; 401 Retry)</text>
    <text x="20" y="90" fill="#34D399" font-family="monospace" font-size="12">✅ CancelToken (Batalkan request instan)</text>
    <text x="20" y="115" fill="#34D399" font-family="monospace" font-size="12">✅ onSendProgress / onReceiveProgress</text>
    <text x="20" y="140" fill="#34D399" font-family="monospace" font-size="12">✅ Global BaseOptions &amp; Timeout Otomatis</text>
    <text x="20" y="165" fill="#34D399" font-family="monospace" font-size="12">✅ Otomatis parse JSON ➔ Map / List</text>
    <text x="190" y="195" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Standar Wajib Production SuperApp &amp; Fintech</text>
  </g>
</svg>
