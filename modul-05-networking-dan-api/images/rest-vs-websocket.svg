<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">KOMUNIKASI DATA: REST API (POLLING) VS WEBSOCKETS (REALTIME DUPLEX)</text>

  <!-- Left: REST API -->
  <g transform="translate(30, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="380" height="34" rx="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. REST API (Request - Response)</text>

    <!-- Visual interaction -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="80" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="40" y="30" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">App HP</text>

      <path d="M 90 15 L 240 15" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <polygon points="240,11 250,15 240,19" fill="#38BDF8"/>
      <text x="165" y="10" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">1. HTTP GET ➔</text>

      <path d="M 240 38 L 90 38" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      <polygon points="90,34 80,38 90,42" fill="#10B981"/>
      <text x="165" y="52" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">⬅ 2. Response 200</text>

      <rect x="260" y="0" width="80" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="300" y="30" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Server</text>
    </g>

    <text x="190" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Koneksi dibuka &amp; ditutup setiap kali request</text>
    <text x="190" y="170" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ideal untuk: CRUD, Login, Pembayaran, Profil</text>
  </g>

  <!-- Right: WebSockets -->
  <g transform="translate(450, 50)">
    <rect width="380" height="210" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="380" height="34" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="190" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. WEBSOCKETS (Full-Duplex Stream)</text>

    <!-- Visual interaction -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="80" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="40" y="30" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">App HP</text>

      <rect x="90" y="15" width="160" height="20" rx="4" fill="#047857" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="170" y="29" fill="#A7F3D0" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">⚡ PIPA DUPLEX TERBUKA</text>

      <rect x="260" y="0" width="80" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="300" y="30" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Server</text>
    </g>

    <text x="190" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Server bisa mendorong data kapan pun tanpa diminta HP</text>
    <text x="190" y="170" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ideal untuk: Live Chat, Crypto Ticker, GPS Driver</text>
  </g>
</svg>
