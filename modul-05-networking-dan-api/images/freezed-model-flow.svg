<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DATA MODELING: JSON PARSING ➔ FREEZED IMMUTABLE DTO ➔ UI PATTERN MATCHING</text>

  <!-- Step 1: Raw JSON -->
  <g transform="translate(30, 50)">
    <rect width="230" height="200" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="230" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1. RAW JSON API</text>

    <text x="15" y="60" fill="#E2E8F0" font-family="monospace" font-size="11">{</text>
    <text x="25" y="82" fill="#93C5FD" font-family="monospace" font-size="11">  "symbol": "BTC",</text>
    <text x="25" y="104" fill="#93C5FD" font-family="monospace" font-size="11">  "price": 95400.50,</text>
    <text x="25" y="126" fill="#93C5FD" font-family="monospace" font-size="11">  "change24h": +4.25</text>
    <text x="15" y="148" fill="#E2E8F0" font-family="monospace" font-size="11">}</text>
    
    <text x="115" y="185" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Data dinamis dari server</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(265, 125)">
    <path d="M 0 10 L 45 10" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="45,5 55,10 45,15" fill="#38BDF8"/>
    <text x="27" y="-5" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">fromJson()</text>
  </g>

  <!-- Step 2: Freezed Model -->
  <g transform="translate(325, 50)">
    <rect width="240" height="200" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
    <rect width="240" height="32" rx="10" fill="#0284C7" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2. @freezed MODEL</text>

    <text x="15" y="60" fill="#E2E8F0" font-family="monospace" font-size="11">@freezed</text>
    <text x="15" y="80" fill="#E2E8F0" font-family="monospace" font-size="11">class CryptoTicker with</text>
    <text x="15" y="100" fill="#38BDF8" font-family="monospace" font-size="11">  _$CryptoTicker {</text>
    <text x="25" y="125" fill="#F8FAFC" font-family="monospace" font-size="11">  const factory CryptoTicker({</text>
    <text x="35" y="145" fill="#34D399" font-family="monospace" font-size="11">    required String symbol,</text>
    <text x="35" y="165" fill="#34D399" font-family="monospace" font-size="11">    required double price,</text>
    <text x="25" y="185" fill="#F8FAFC" font-family="monospace" font-size="11">  }) = _CryptoTicker;</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(570, 125)">
    <path d="M 0 10 L 45 10" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="45,5 55,10 45,15" fill="#10B981"/>
    <text x="27" y="-5" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">copyWith()</text>
  </g>

  <!-- Step 3: Type Safe UI -->
  <g transform="translate(630, 50)">
    <rect width="200" height="200" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="200" height="32" rx="10" fill="#059669" fill-opacity="0.2"/>
    <text x="100" y="21" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. TYPE-SAFE UI</text>

    <text x="15" y="65" fill="#E2E8F0" font-family="monospace" font-size="11">Text(ticker.symbol);</text>
    <text x="15" y="90" fill="#34D399" font-family="monospace" font-size="11">Text('\$${ticker.price}');</text>
    
    <rect x="15" y="115" width="170" height="70" rx="6" fill="#065F46" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="100" y="137" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✨ Immutability Mutlak</text>
    <text x="100" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Autocompletion IDE &amp;</text>
    <text x="100" y="172" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Mencegah Typo Runtime</text>
  </g>
</svg>
