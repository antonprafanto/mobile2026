<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">KONSEP GEOFENCING &amp; KALKULASI JARAK HAVERSINE (ABSENSI GPS)</text>

  <!-- Map Radar Visual Area -->
  <g transform="translate(40, 48)">
    <rect width="360" height="215" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Grid Lines -->
    <line x1="20" y1="107" x2="340" y2="107" stroke="#1E293B" stroke-width="1" stroke-dasharray="4"/>
    <line x1="180" y1="20" x2="180" y2="195" stroke="#1E293B" stroke-width="1" stroke-dasharray="4"/>

    <!-- Outer Radius Circle (100m) -->
    <circle cx="180" cy="107" r="90" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3"/>
    <text x="275" y="102" fill="#64748B" font-family="monospace" font-size="8">100m</text>

    <!-- Allowed Geofence Radius Circle (50m) -->
    <circle cx="180" cy="107" r="55" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" filter="url(#glow)"/>
    <text x="180" y="65" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Radius Absensi 50m</text>

    <!-- Center: Office Marker -->
    <circle cx="180" cy="107" r="7" fill="#38BDF8"/>
    <circle cx="180" cy="107" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
    <text x="180" y="130" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Kantor Pusat</text>

    <!-- User A (Inside - 25m) -->
    <circle cx="150" cy="115" r="5" fill="#34D399"/>
    <text x="145" y="105" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold">User A (25m)</text>

    <!-- User B (Outside - 120m) -->
    <circle cx="310" cy="55" r="5" fill="#F43F5E"/>
    <text x="280" y="45" fill="#FDA4AF" font-family="monospace" font-size="9" font-weight="bold">User B (120m)</text>
  </g>

  <!-- Explanation Cards Right Side -->
  <g transform="translate(430, 48)">
    <!-- Card 1: User A Valid -->
    <rect width="390" height="100" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="20" y="19" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">📍 USER A (Jarak 25 Meter ➔ DI DALAM RADIUS)</text>
    
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Status Absensi: <tspan fill="#34D399" font-weight="bold">VALID &amp; DIIZINKAN ✅</tspan></text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Kamera selfie dibuka dan tombol check-in aktif.</text>
    <text x="20" y="88" fill="#38BDF8" font-family="monospace" font-size="10">Geolocator.distanceBetween(lat1, lon1, lat2, lon2) &lt;= 50</text>
  </g>

  <g transform="translate(430, 160)">
    <!-- Card 2: User B Rejected -->
    <rect width="390" height="100" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="390" height="28" rx="10" fill="#E11D48" fill-opacity="0.25"/>
    <text x="20" y="19" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold">🚫 USER B (Jarak 120 Meter ➔ DI LUAR RADIUS)</text>
    
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Status Absensi: <tspan fill="#F43F5E" font-weight="bold">DITOLAK / INVALID ❌</tspan></text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Tombol check-in terkunci dengan pesan "Anda berada di luar area kantor".</text>
    <text x="20" y="88" fill="#FDA4AF" font-family="monospace" font-size="10">Kelebihan Jarak: 70 meter dari batas izin terluar.</text>
  </g>
</svg>
