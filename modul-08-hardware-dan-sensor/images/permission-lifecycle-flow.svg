<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ALUR MANAJEMEN IZIN HARDWARE MODERN (ANDROID 14+ &amp; iOS)</text>

  <!-- Step 1: Check Status -->
  <g transform="translate(30, 55)">
    <rect width="170" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="85" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. Cek Status Izin</text>

    <text x="85" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Metode Pemanggil:</text>
    <text x="85" y="90" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Permission.camera.status</text>

    <rect x="10" y="115" width="150" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="85" y="138" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">Granted / Denied /</text>
    <text x="85" y="158" fill="#FDA4AF" font-family="monospace" font-size="10" text-anchor="middle">PermanentlyDenied</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 150 L 235 150" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="235,145 245,150 235,155" fill="#38BDF8"/>

  <!-- Step 2: Request Dialog -->
  <g transform="translate(245, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="90" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. Request Dialog OS</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Jika status Denied:</text>
    <text x="90" y="88" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">await .request()</text>

    <rect x="15" y="110" width="150" height="65" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Dialog Sistem Muncul:</text>
    <text x="90" y="152" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">[Izinkan] / [Tolak]</text>
  </g>

  <!-- Arrow 2: Split to Step 3 & 4 -->
  <path d="M 430 115 L 465 100" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="465,95 475,100 465,105" fill="#10B981"/>

  <path d="M 430 185 L 465 200" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="465,195 475,200 465,205" fill="#F43F5E"/>

  <!-- Step 3: Granted -->
  <g transform="translate(480, 55)">
    <rect width="350" height="90" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="350" height="28" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="175" y="19" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3A. Izin Diberikan (isGranted)</text>

    <text x="25" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Aksi: <tspan fill="#34D399" font-weight="bold">Inisialisasi Kamera / GPS / Sensor</tspan></text>
    <text x="25" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Kamera aktif &amp; siap mengambil foto / scan barcode.</text>
  </g>

  <!-- Step 4: Permanently Denied -->
  <g transform="translate(480, 160)">
    <rect width="350" height="90" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="350" height="28" rx="10" fill="#E11D48" fill-opacity="0.25"/>
    <text x="175" y="19" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3B. Ditolak Permanen (isPermanentlyDenied)</text>

    <text x="25" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Solusi: <tspan fill="#FDE047" font-weight="bold">openAppSettings()</tspan></text>
    <text x="25" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Buka pengaturan HP agar user mengaktifkan izin manual.</text>
  </g>
</svg>
