<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="350" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PENANGANAN DATA ASINKRON: CARA MANUAL TRADISIONAL VS ASYNCVALUE RIVERPOD</text>

  <!-- Left: Manual State Handling -->
  <g transform="translate(30, 55)">
    <rect width="415" height="250" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="415" height="34" rx="12" fill="#991B1B" fill-opacity="0.25"/>
    <text x="207" y="22" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">❌ CARA MANUAL (RENTAN BUG &amp; REPOT)</text>

    <!-- Code Block Manual -->
    <rect x="15" y="48" width="385" height="85" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="25" y="70" fill="#F87171" font-family="monospace" font-size="11">bool isLoading = true;</text>
    <text x="25" y="90" fill="#F87171" font-family="monospace" font-size="11">String? errorMessage;</text>
    <text x="25" y="110" fill="#F87171" font-family="monospace" font-size="11">List&lt;Produk&gt; daftarProduk = [];</text>
    <text x="25" y="126" fill="#94A3B8" font-family="monospace" font-size="9.5">// Wajib di-setState manual di setiap callback!</text>

    <rect x="15" y="145" width="385" height="80" rx="6" fill="#991B1B" fill-opacity="0.15" stroke="#334155" stroke-width="1"/>
    <text x="25" y="168" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">Kelemahan Cara Manual:</text>
    <text x="25" y="188" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Rawan lupa mengubah `isLoading = false` saat error</text>
    <text x="25" y="206" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Puluhan baris if-else bertingkat mengotori UI</text>
  </g>

  <!-- Right: AsyncValue.when() -->
  <g transform="translate(475, 55)">
    <rect width="415" height="250" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="415" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="207" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">✅ RIVERPOD ASYNCVALUE.WHEN() (OTOMATIS &amp; RAPI)</text>

    <!-- AsyncValue Hub -->
    <rect x="110" y="48" width="195" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="207" y="68" fill="#34D399" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">AsyncValue&lt;List&lt;Produk&gt;&gt;</text>

    <!-- 3 Arrows to 3 Branches -->
    <path d="M 130 78 L 65 110" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowYellow)"/>
    <path d="M 207 78 L 207 110" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <path d="M 285 78 L 350 110" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <!-- 3 State Cards -->
    <rect x="15" y="115" width="115" height="70" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="72" y="135" fill="#FDE047" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">⏳ loading:</text>
    <text x="72" y="155" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">CircularProgress</text>
    <text x="72" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Indikator putar</text>

    <rect x="150" y="115" width="115" height="70" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="207" y="135" fill="#F87171" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">❌ error:</text>
    <text x="207" y="155" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">Text(err.msg)</text>
    <text x="207" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Pesan kesalahan</text>

    <rect x="285" y="115" width="115" height="70" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="342" y="135" fill="#34D399" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">✅ data:</text>
    <text x="342" y="155" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">ListView(data)</text>
    <text x="342" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Render list data</text>

    <rect x="15" y="195" width="385" height="38" rx="6" fill="#059669" fill-opacity="0.15" stroke="#334155" stroke-width="1"/>
    <text x="207" y="218" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">🔒 Kompiler mewajibkan ketiga cabang ditangani (Bebas Crash!)</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="312" width="860" height="26" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="329" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">💡 Dengan AsyncValue, penanganan data internet menjadi deklaratif, terstruktur, dan anti layar putih beku!</text>
</svg>
