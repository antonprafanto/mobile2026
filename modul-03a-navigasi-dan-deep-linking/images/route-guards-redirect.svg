<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#F87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ALUR KERJA ROUTE GUARDS &amp; REDIRECT (SATPAM RUTE TERPUSAT)</text>

  <!-- Step 1: Navigasi Masuk -->
  <g transform="translate(30, 70)">
    <rect width="210" height="180" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="210" height="32" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="105" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. PENGGUNA MENUJU RUTE</text>
    
    <text x="105" y="60" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Contoh Tujuan:</text>
    <rect x="20" y="75" width="170" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="93" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">context.go('/checkout')</text>

    <text x="105" y="125" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Atau Klik Deep Link:</text>
    <rect x="20" y="140" width="170" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="105" y="158" fill="#A855F7" font-family="monospace" font-size="11" text-anchor="middle">tokokita.com/profil</text>
  </g>

  <!-- Arrow 1 -> Gatekeeper -->
  <line x1="240" y1="160" x2="275" y2="160" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Gatekeeper (Satpam Rute) -->
  <g transform="translate(285, 55)">
    <rect width="280" height="210" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="280" height="34" rx="12" fill="#4F46E5" fill-opacity="0.3"/>
    <text x="140" y="23" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. SATPAM: REDIRECT LOGIC</text>

    <text x="20" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold">Fungsi redirect(context, state):</text>
    <rect x="15" y="78" width="250" height="52" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="25" y="98" fill="#38BDF8" font-family="monospace" font-size="10.5">final loggedIn = auth.isLoggedIn;</text>
    <text x="25" y="118" fill="#38BDF8" font-family="monospace" font-size="10.5">if (!loggedIn) return '/login';</text>

    <text x="140" y="152" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pemeriksaan Status Login:</text>
    <text x="140" y="172" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">Apakah user memiliki Token / Sesi aktif?</text>
    <text x="140" y="190" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Dipicu otomatis via refreshListenable</text>
  </g>

  <!-- Branching Arrows -->
  <!-- NO: Belum Login -> Ke Login Page -->
  <path d="M 565 130 L 610 130 L 610 95 L 635 95" fill="none" stroke="#F87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="595" y="118" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">TIDAK</text>

  <!-- YES: Sudah Login -> Ke Halaman Tujuan -->
  <path d="M 565 190 L 610 190 L 610 225 L 635 225" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="600" y="213" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">YA</text>

  <!-- Destination Cards -->
  <!-- Target 1: Belum Login -->
  <g transform="translate(645, 55)">
    <rect width="225" height="90" rx="10" fill="url(#cardGrad)" stroke="#F87171" stroke-width="1.5"/>
    <text x="112" y="28" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🚫 Belum Login: Dialihkan</text>
    <text x="112" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">Buka Layar: /login</text>
    <text x="112" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">(Simpan target rute untuk redirect balik)</text>
  </g>

  <!-- Target 2: Sudah Login -->
  <g transform="translate(645, 175)">
    <rect width="225" height="90" rx="10" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <text x="112" y="28" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✅ Sudah Login: Lolos</text>
    <text x="112" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">Buka Layar Tujuan Asli</text>
    <text x="112" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">(/checkout atau /profil)</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="30" y="295" width="840" height="42" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="450" y="321" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Proteksi Terpusat: Tidak perlu if-else di setiap tombol; GoRouter menjaga seluruh rute secara otomatis!</text>
</svg>

