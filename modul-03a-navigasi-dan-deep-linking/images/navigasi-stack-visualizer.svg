<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="370" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">VISUALISASI TUMPUKAN LAYAR (NAVIGATION STACK): PUSH, POP, REPLACE, &amp; GO</text>

  <!-- 1. context.push() -->
  <g transform="translate(25, 60)">
    <rect width="200" height="245" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="200" height="34" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="100" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. context.push('/B')</text>

    <text x="100" y="58" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tumpuk Layar Baru</text>

    <!-- Stack visual: A at bottom, B on top -->
    <rect x="35" y="140" width="130" height="42" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="100" y="166" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Layar A (Bawah)</text>

    <!-- Arrow up -->
    <text x="100" y="132" fill="#38BDF8" font-size="14" text-anchor="middle">⬆️ + Tumpuk</text>

    <rect x="35" y="75" width="130" height="42" rx="6" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="100" y="101" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Layar B (Aktif)</text>

    <line x1="15" y1="195" x2="185" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="100" y="214" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Tumpukan: [A, B]</text>
    <text x="100" y="232" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Tombol Back otomatis aktif</text>
  </g>

  <!-- 2. context.pop() -->
  <g transform="translate(245, 60)">
    <rect width="200" height="245" rx="12" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <rect width="200" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="100" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. context.pop()</text>

    <text x="100" y="58" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cabut Layar Teratas</text>

    <!-- Removed B -->
    <rect x="35" y="75" width="130" height="42" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="100" y="101" fill="#EF4444" font-family="monospace" font-size="12" text-anchor="middle">Layar B (Dibuang ❌)</text>

    <!-- Arrow down -->
    <text x="100" y="132" fill="#34D399" font-size="14" text-anchor="middle">⬇️ Kembali ke A</text>

    <rect x="35" y="140" width="130" height="42" rx="6" fill="#065F46" stroke="#34D399" stroke-width="1.5"/>
    <text x="100" y="166" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Layar A (Aktif)</text>

    <line x1="15" y1="195" x2="185" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="100" y="214" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Tumpukan: [A]</text>
    <text x="100" y="232" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Bisa bawa data: pop(data)</text>
  </g>

  <!-- 3. context.replace() -->
  <g transform="translate(465, 60)">
    <rect width="200" height="245" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="200" height="34" rx="12" fill="#D97706" fill-opacity="0.25"/>
    <text x="100" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. context.replace('/C')</text>

    <text x="100" y="58" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tukar Layar Teratas</text>

    <!-- Replacement box -->
    <rect x="35" y="75" width="130" height="42" rx="6" fill="#92400E" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="101" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Layar C (Gantikan B)</text>

    <!-- Icon swap -->
    <text x="100" y="132" fill="#F59E0B" font-size="13" text-anchor="middle">🔄 Tukar di Tempat</text>

    <rect x="35" y="140" width="130" height="42" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="100" y="166" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Layar A (Bawah)</text>

    <line x1="15" y1="195" x2="185" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="100" y="214" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Tumpukan: [A, C]</text>
    <text x="100" y="232" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Cocok: Splash / Login ganti</text>
  </g>

  <!-- 4. context.go() -->
  <g transform="translate(685, 60)">
    <rect width="210" height="245" rx="12" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#7E22CE" fill-opacity="0.25"/>
    <text x="105" y="22" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. context.go('/toko/42')</text>

    <text x="105" y="58" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tata Ulang Pohon Rute</text>

    <!-- New declarative stack -->
    <rect x="35" y="75" width="140" height="42" rx="6" fill="#6B21A8" stroke="#A855F7" stroke-width="1.5"/>
    <text x="105" y="101" fill="#FFFFFF" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">Detail #42 (Puncak)</text>

    <text x="105" y="132" fill="#A855F7" font-size="13" text-anchor="middle">🔗 Sesuai Pohon URI</text>

    <rect x="35" y="140" width="140" height="42" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="105" y="166" fill="#94A3B8" font-family="monospace" font-size="11.5" text-anchor="middle">Katalog Toko (Induk)</text>

    <line x1="15" y1="195" x2="195" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="105" y="214" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" text-anchor="middle">Tumpukan: [/toko, /detail/42]</text>
    <text x="105" y="232" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Mendukung Deep Link &amp; Web</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="25" y="320" width="870" height="34" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="342" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">💡 Aturan Praktis: Gunakan go() untuk menu utama, push() untuk alur detail linier, dan replace() untuk alur splash/login!</text>
</svg>

