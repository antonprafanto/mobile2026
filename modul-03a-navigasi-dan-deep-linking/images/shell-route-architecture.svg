<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="340" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR STATEFULSHELLROUTE (PERSISTENT BOTTOM NAVIGATION)</text>

  <!-- Parent Container: StatefulShellRoute -->
  <g transform="translate(30, 50)">
    <rect width="800" height="270" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="2"/>
    <rect width="800" height="34" rx="12" fill="#4F46E5" fill-opacity="0.25"/>
    <text x="20" y="23" fill="#A5B4FC" font-family="monospace" font-size="13" font-weight="bold">StatefulShellRoute.indexedStack (Menyimpan State Tab di Memori)</text>

    <!-- Branch 1: Home Tab -->
    <g transform="translate(30, 50)">
      <rect width="220" height="150" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <rect width="220" height="28" rx="10" fill="#0284C7" fill-opacity="0.2"/>
      <text x="110" y="19" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Branch 1: /home</text>
      
      <!-- Sub-screens -->
      <rect x="15" y="40" width="190" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Beranda (Feed Scroll)</text>
      
      <rect x="15" y="90" width="190" height="45" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="110" y="112" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">/home/notifikasi</text>
      <text x="110" y="127" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Stack terpisah)</text>
    </g>

    <!-- Branch 2: Catalog Tab -->
    <g transform="translate(290, 50)">
      <rect width="220" height="150" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <rect width="220" height="28" rx="10" fill="#059669" fill-opacity="0.2"/>
      <text x="110" y="19" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Branch 2: /katalog</text>
      
      <rect x="15" y="40" width="190" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Katalog Grid Produk</text>
      
      <rect x="15" y="90" width="190" height="45" rx="6" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
      <text x="110" y="112" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">/katalog/detail/:id</text>
      <text x="110" y="127" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Posisi filter tetap aman)</text>
    </g>

    <!-- Branch 3: Profile Tab -->
    <g transform="translate(550, 50)">
      <rect width="220" height="150" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <rect width="220" height="28" rx="10" fill="#B45309" fill-opacity="0.2"/>
      <text x="110" y="19" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Branch 3: /profil</text>
      
      <rect x="15" y="40" width="190" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Pengaturan Akun</text>
      
      <rect x="15" y="90" width="190" height="45" rx="6" fill="#B45309" fill-opacity="0.2" stroke="#FDE047" stroke-width="1"/>
      <text x="110" y="112" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">/profil/edit-alamat</text>
      <text x="110" y="127" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Input form tidak hilang)</text>
    </g>

    <!-- Bottom Navigation Bar Widget -->
    <g transform="translate(30, 215)">
      <rect width="740" height="40" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="120" y="25" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🏠 Tab 1: Beranda</text>
      <text x="370" y="25" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🛍️ Tab 2: Katalog</text>
      <text x="620" y="25" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">👤 Tab 3: Profil</text>
    </g>
  </g>
</svg>
