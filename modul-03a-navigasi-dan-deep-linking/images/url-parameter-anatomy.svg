<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="410" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="460" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ANATOMI PENGIRIMAN DATA ANTAR HALAMAN PADA GOROUTER</text>

  <!-- Visual URL Bar at Top -->
  <g transform="translate(40, 52)">
    <rect width="840" height="46" rx="8" fill="#090D16" stroke="#475569" stroke-width="1.5"/>
    <text x="18" y="28" fill="#64748B" font-family="monospace" font-size="12.5">https://tokokita.com</text>
    
    <!-- Path Section -->
    <rect x="180" y="7" width="165" height="32" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="262" y="28" fill="#38BDF8" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">/produk/SKU-99</text>
    
    <!-- Query Section -->
    <rect x="355" y="7" width="280" height="32" rx="6" fill="#D97706" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="495" y="28" fill="#FCD34D" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">?warna=merah&amp;sort=termurah</text>

    <!-- Extra indicator -->
    <rect x="645" y="7" width="180" height="32" rx="6" fill="#7C3AED" fill-opacity="0.3" stroke="#A855F7" stroke-width="1.5"/>
    <text x="735" y="28" fill="#C084FC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">[+ extra: Objek RAM]</text>
  </g>

  <!-- 3 Comparison Columns -->
  <!-- 1. Path Parameters -->
  <g transform="translate(40, 114)">
    <rect width="265" height="225" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="265" height="34" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="132" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. PATH PARAMETER</text>

    <text x="16" y="58" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">🎯 Pengenal Unik Resource</text>
    <text x="16" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Wajib ada di dalam struktur URL.</text>

    <rect x="12" y="92" width="241" height="50" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="20" y="112" fill="#64748B" font-family="monospace" font-size="10">// path: '/produk/:id'</text>
    <text x="20" y="130" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="bold">state.pathParameters['id']</text>

    <line x1="16" y1="156" x2="249" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="16" y="176" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">💡 Kapan dipakai?</text>
    <text x="16" y="194" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">ID barang, ID pesanan,</text>
    <text x="16" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">username akun profil.</text>
  </g>

  <!-- 2. Query Parameters -->
  <g transform="translate(325, 114)">
    <rect width="270" height="225" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="270" height="34" rx="12" fill="#D97706" fill-opacity="0.25"/>
    <text x="135" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. QUERY PARAMETER</text>

    <text x="16" y="58" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">🔍 Filter, Sortir, &amp; Paging</text>
    <text x="16" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Opsional, diawali tanda tanya (?).</text>

    <rect x="12" y="92" width="246" height="50" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="20" y="112" fill="#64748B" font-family="monospace" font-size="10">// URL: /cari?sort=termurah</text>
    <text x="20" y="130" fill="#FCD34D" font-family="monospace" font-size="10.5" font-weight="bold">state.uri.queryParameters['sort']</text>

    <line x1="16" y1="156" x2="254" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="16" y="176" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">💡 Kapan dipakai?</text>
    <text x="16" y="194" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Kata kunci pencarian,</text>
    <text x="16" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">filter kategori &amp; nomor halaman.</text>
  </g>

  <!-- 3. Extra Object -->
  <g transform="translate(615, 114)">
    <rect width="265" height="225" rx="12" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect width="265" height="34" rx="12" fill="#7E22CE" fill-opacity="0.25"/>
    <text x="132" y="22" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. EXTRA OBJECT</text>

    <text x="16" y="58" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">📦 Objek Dart di RAM</text>
    <text x="16" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Tidak tampil di URL (In-Memory).</text>

    <rect x="12" y="92" width="241" height="50" rx="6" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="20" y="112" fill="#64748B" font-family="monospace" font-size="10">// context.push(..., extra: item)</text>
    <text x="20" y="130" fill="#C084FC" font-family="monospace" font-size="10.5" font-weight="bold">state.extra as ModelTransaksi</text>

    <line x1="16" y1="156" x2="249" y2="156" stroke="#334155" stroke-width="1"/>
    <text x="16" y="176" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">💡 Kapan dipakai?</text>
    <text x="16" y="194" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Objek form checkout kompleks,</text>
    <text x="16" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">data keranjang belanja.</text>
  </g>

  <!-- Footer Tip -->
  <g transform="translate(40, 354)">
    <rect width="840" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="420" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" text-anchor="middle">⚠️ <tspan fill="#F8FAFC" font-weight="bold">Catatan Khusus Web &amp; Deep Link:</tspan> Extra Object akan hilang jika halaman di-refresh peramban. Utamakan Path Parameter untuk data krusial!</text>
  </g>
</svg>
