<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR CLEAN ARCHITECTURE 3-LAYERS &amp; DEPENDENCY INVERSION</text>

  <!-- Layer 1: Presentation Layer -->
  <g transform="translate(30, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="120" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. PRESENTATION LAYER</text>

    <!-- Components -->
    <rect x="15" y="45" width="210" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="120" y="66" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">UI Screens &amp; Widgets</text>

    <rect x="15" y="85" width="210" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="120" y="106" fill="#BAE6FD" font-family="monospace" font-size="10" text-anchor="middle">BLoC / Cubit / Notifier</text>

    <rect x="15" y="125" width="210" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="120" y="146" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">UI States &amp; Events</text>

    <text x="120" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Hanya Berurusan dengan UI</text>
  </g>

  <!-- Arrow: Presentation to Domain -->
  <path d="M 285 150 L 315 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="315,145 325,150 315,155" fill="#10B981"/>

  <!-- Layer 2: Domain Layer (Core Center) -->
  <g transform="translate(315, 50)">
    <rect width="230" height="205" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="230" height="34" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="115" y="22" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. DOMAIN LAYER (CORE)</text>

    <!-- Components -->
    <rect x="15" y="45" width="200" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="66" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Entities (Pure Dart)</text>

    <rect x="15" y="85" width="200" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="106" fill="#A7F3D0" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Use Cases / Interactors</text>

    <rect x="15" y="125" width="200" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="146" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Repository Contracts</text>

    <text x="115" y="188" fill="#FDE047" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">⚡ Zero Flutter Framework Dep</text>
  </g>

  <!-- Arrow: Data to Domain -->
  <path d="M 575 150 L 545 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="555,145 545,150 555,155" fill="#10B981"/>

  <!-- Layer 3: Data Layer -->
  <g transform="translate(590, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. DATA LAYER</text>

    <!-- Components -->
    <rect x="15" y="45" width="210" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="66" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">Repository Implementation</text>

    <rect x="15" y="85" width="210" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="106" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">RemoteDataSource (Dio API)</text>

    <rect x="15" y="125" width="210" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="146" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">LocalDataSource (Drift/Hive)</text>

    <text x="120" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Models (DTOs fromJson/toJson)</text>
  </g>
</svg>
