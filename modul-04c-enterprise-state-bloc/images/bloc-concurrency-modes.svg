<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TRANSFORMER BLOC CONCURRENCY: MELINDUNGI SISTEM DARI SPAM EVENT</text>

  <!-- Card 1: droppable() -->
  <g transform="translate(30, 52)">
    <rect width="260" height="255" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#991B1B" fill-opacity="0.25"/>
    <text x="130" y="22" fill="#FCA5A5" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">🛡️ 1. droppable()</text>

    <text x="130" y="60" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Abaikan Event Baru Jika Sibuk</text>

    <!-- Visual Flow -->
    <rect x="20" y="74" width="220" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="130" y="94" fill="#34D399" font-family="monospace" font-size="10.5" text-anchor="middle">Event 1: Bayar Rp 500k ✅</text>

    <text x="130" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">👇 User klik beruntun 3x cepat</text>

    <rect x="20" y="132" width="220" height="32" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="130" y="152" fill="#F87171" font-family="monospace" font-size="10.5" text-anchor="middle">Event 2: Bayar (DROP) ❌</text>

    <rect x="20" y="172" width="220" height="32" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="130" y="192" fill="#F87171" font-family="monospace" font-size="10.5" text-anchor="middle">Event 3: Bayar (DROP) ❌</text>

    <rect x="15" y="214" width="230" height="30" rx="5" fill="#991B1B" fill-opacity="0.15" stroke="#334155" stroke-width="1"/>
    <text x="130" y="232" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">Kasus: Transaksi &amp; Checkout Bank</text>
  </g>

  <!-- Card 2: restartable() -->
  <g transform="translate(330, 52)">
    <rect width="260" height="255" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="130" y="22" fill="#38BDF8" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">🔄 2. restartable()</text>

    <text x="130" y="60" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Batalkan Lama, Jalankan Terbaru</text>

    <!-- Visual Flow -->
    <rect x="20" y="74" width="220" height="32" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="130" y="94" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">Ketik 'lap' ➔ Dibatalkan 🛑</text>

    <text x="130" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">👇 User mengetik huruf baru</text>

    <rect x="20" y="132" width="220" height="32" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="130" y="152" fill="#94A3B8" font-family="monospace" font-size="10.5" text-anchor="middle">Ketik 'lapt' ➔ Dibatalkan 🛑</text>

    <rect x="20" y="172" width="220" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="130" y="192" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Ketik 'laptop' ➔ Diproses! 🚀</text>

    <rect x="15" y="214" width="230" height="30" rx="5" fill="#0284C7" fill-opacity="0.15" stroke="#334155" stroke-width="1"/>
    <text x="130" y="232" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">Kasus: Debounce Pencarian Realtime</text>
  </g>

  <!-- Card 3: sequential() & concurrent() -->
  <g transform="translate(630, 52)">
    <rect width="260" height="255" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="130" y="22" fill="#34D399" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">📋 3. sequential()</text>

    <text x="130" y="60" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Antrean Tertib Satu per Satu</text>

    <!-- Visual Flow -->
    <rect x="20" y="74" width="220" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="130" y="94" fill="#34D399" font-family="monospace" font-size="10.5" text-anchor="middle">1. Download Part A (Jalan)</text>

    <text x="130" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">👇 Antre dalam barisan FIFO</text>

    <rect x="20" y="132" width="220" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="130" y="152" fill="#FDE047" font-family="monospace" font-size="10.5" text-anchor="middle">2. Download Part B (Menunggu)</text>

    <rect x="20" y="172" width="220" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="130" y="192" fill="#FDE047" font-family="monospace" font-size="10.5" text-anchor="middle">3. Download Part C (Menunggu)</text>

    <rect x="15" y="214" width="230" height="30" rx="5" fill="#059669" fill-opacity="0.15" stroke="#334155" stroke-width="1"/>
    <text x="130" y="232" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">Kasus: Sinkronisasi Database Offline</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="318" width="860" height="26" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="335" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">💡 Dengan bloc_concurrency, Anda mengontrol lalu lintas data tanpa perlu menulis ratusan baris kode timer!</text>
</svg>

