<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">KUADRAN 4 WIDGET UTAMA BLOC: KAPAN MENGGUNAKAN APA?</text>

  <!-- Grid Card 1: BlocBuilder (Top-Left) -->
  <g transform="translate(30, 52)">
    <rect width="415" height="130" rx="10" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <rect width="415" height="28" rx="10" fill="#4338CA" fill-opacity="0.25"/>
    <text x="207" y="19" fill="#A5B4FC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">🎨 1. BlocBuilder&lt;Bloc, State&gt;</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">Fungsi: Menggambar / Merender Visual UI</text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Parameter wajib: `builder: (context, state) =&gt; Widget`</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Perilaku: Me-rebuild UI setiap kali ada state baru</text>
    <text x="20" y="112" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold">⚠️ Dilarang memunculkan Dialog / SnackBar di dalam sini!</text>
  </g>

  <!-- Grid Card 2: BlocListener (Top-Right) -->
  <g transform="translate(475, 52)">
    <rect width="415" height="130" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="415" height="28" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="207" y="19" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡ 2. BlocListener&lt;Bloc, State&gt;</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">Fungsi: Menjalankan Efek Samping (1 Kali Saja)</text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Parameter wajib: `listener: (context, state) { ... }`</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Perilaku: TIDAK me-rebuild UI sama sekali</text>
    <text x="20" y="112" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold">✅ Tempat resmi: SnackBar, Dialog konfirmasi, Navigasi</text>
  </g>

  <!-- Grid Card 3: BlocConsumer (Bottom-Left) -->
  <g transform="translate(30, 192)">
    <rect width="415" height="120" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="415" height="28" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="207" y="19" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">🔀 3. BlocConsumer&lt;Bloc, State&gt;</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">Fungsi: Menggabungkan Builder + Listener</text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Memiliki 2 method sekaligus: `builder:` DAN `listener:`</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Perilaku: Rebuild UI sekaligus picu notifikasi/dialog</text>
    <text x="20" y="106" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5">💡 Hemat baris: Hindari nesting Listener membungkus Builder</text>
  </g>

  <!-- Grid Card 4: BlocSelector (Bottom-Right) -->
  <g transform="translate(475, 192)">
    <rect width="415" height="120" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="415" height="28" rx="10" fill="#0284C7" fill-opacity="0.25"/>
    <text x="207" y="19" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">🔍 4. BlocSelector&lt;Bloc, State, Nilai&gt;</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold">Fungsi: Filter Nilai Spesifik untuk Performa Tinggi</text>
    <text x="20" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Parameter wajib: `selector: (state) =&gt; state.jumlahItem`</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">• Perilaku: HANYA rebuild jika nilai terpilih berubah</text>
    <text x="20" y="106" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5">💡 Sangat efisien untuk Badge keranjang belanja di AppBar</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="322" width="860" height="26" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="339" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎯 Rumus Emas: Gambar UI = Builder | Dialog/SnackBar = Listener | Keduanya = Consumer | Hemat CPU = Selector</text>
</svg>

