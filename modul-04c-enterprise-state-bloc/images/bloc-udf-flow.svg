<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">BLOC UNIDIRECTIONAL DATA FLOW (UDF) &amp; EVENT-DRIVEN ARCHITECTURE</text>

  <!-- Left: UI Layer (User Action) -->
  <g transform="translate(30, 55)">
    <rect width="220" height="190" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. UI SCREEN</text>

    <text x="110" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Pengguna menekan</text>
    <text x="110" y="85" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Tombol "Tambah Produk"</text>

    <rect x="20" y="110" width="180" height="60" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="110" y="132" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">context.read&lt;CartBloc&gt;()</text>
    <text x="110" y="152" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">.add(AddToCart(item))</text>
  </g>

  <!-- Top Arrow: EVENT -->
  <g transform="translate(255, 80)">
    <path d="M 15 20 L 70 20" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="70,14 82,20 70,26" fill="#F59E0B"/>
    <text x="45" y="10" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">EVENT ➔</text>
  </g>

  <!-- Middle: BLoC Core (Business Logic) -->
  <g transform="translate(340, 55)">
    <rect width="230" height="190" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#glow)"/>
    <rect width="230" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="115" y="21" fill="#FDE047" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2. BLOC / CUBIT</text>

    <text x="15" y="62" fill="#94A3B8" font-family="monospace" font-size="11">// Menerima Event</text>
    <text x="15" y="82" fill="#E2E8F0" font-family="monospace" font-size="11">on&lt;AddToCart&gt;((e, emit) {</text>
    <text x="25" y="105" fill="#93C5FD" font-family="monospace" font-size="11">  final updated = ...;</text>
    <text x="25" y="128" fill="#34D399" font-family="monospace" font-size="11">  // Memancarkan State baru</text>
    <text x="25" y="150" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">  emit(CartLoaded(items));</text>
    <text x="15" y="172" fill="#E2E8F0" font-family="monospace" font-size="11">});</text>
  </g>

  <!-- Bottom Arrow: STATE -->
  <g transform="translate(575, 170)">
    <path d="M 70 20 L 15 20" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="15,14 3,20 15,26" fill="#10B981"/>
    <text x="42" y="10" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⬅ STATE EMIT</text>
  </g>

  <!-- Right: BlocBuilder / Consumer -->
  <g transform="translate(610, 55)">
    <rect width="220" height="190" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#059669" fill-opacity="0.2"/>
    <text x="110" y="21" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. RE-RENDER UI</text>

    <text x="15" y="65" fill="#E2E8F0" font-family="monospace" font-size="11">BlocBuilder&lt;CartState&gt;(</text>
    <text x="25" y="88" fill="#93C5FD" font-family="monospace" font-size="11">builder: (ctx, state) {</text>
    <text x="35" y="112" fill="#34D399" font-family="monospace" font-size="11">  if (state is CartLoaded)</text>
    <text x="45" y="132" fill="#FDE047" font-family="monospace" font-size="11">    Badge(count: items);</text>
    <text x="25" y="155" fill="#93C5FD" font-family="monospace" font-size="11">}</text>
    <text x="15" y="175" fill="#E2E8F0" font-family="monospace" font-size="11">)</text>
  </g>
</svg>
