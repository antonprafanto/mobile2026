<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR BACKEND MOBILE: DART FROG VS FIREBASE VS SUPABASE</text>

  <!-- Column 1: Dart Frog -->
  <g transform="translate(30, 50)">
    <rect width="250" height="210" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="125" y="21" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1. DART FROG (CUSTOM API)</text>

    <text x="20" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Bahasa: <tspan fill="#38BDF8" font-weight="bold">Dart Murni (Fullstack)</tspan></text>
    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Kendali: <tspan fill="#34D399" font-weight="bold">100% Kontrol Penuh</tspan></text>
    <text x="20" y="104" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Database: <tspan fill="#E2E8F0">Postgres / Redis / MySQL</tspan></text>
    <text x="20" y="126" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Deploy: <tspan fill="#FDE047">Docker, VPS, GCP, AWS</tspan></text>

    <rect x="15" y="145" width="220" height="45" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="125" y="165" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ideal untuk:</text>
    <text x="125" y="180" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Logika Bisnis Rahasia &amp; Microservices</text>
  </g>

  <!-- Column 2: Firebase -->
  <g transform="translate(305, 50)">
    <rect width="250" height="210" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="125" y="21" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2. FIREBASE (GOOGLE BaaS)</text>

    <text x="20" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Model Data: <tspan fill="#FDE047" font-weight="bold">NoSQL Firestore</tspan></text>
    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Push Notif: <tspan fill="#34D399" font-weight="bold">FCM Terbaik (Native)</tspan></text>
    <text x="20" y="104" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Auth &amp; Storage: <tspan fill="#34D399" font-weight="bold">Siap Pakai 5 Menit</tspan></text>
    <text x="20" y="126" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Vendor: <tspan fill="#FDA4AF">Google Cloud Lock-In</tspan></text>

    <rect x="15" y="145" width="220" height="45" rx="6" fill="#B45309" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="165" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ideal untuk:</text>
    <text x="125" y="180" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">MVP Cepat, Push Notif, Social Chat</text>
  </g>

  <!-- Column 3: Supabase -->
  <g transform="translate(580, 50)">
    <rect width="250" height="210" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="250" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="125" y="21" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3. SUPABASE (OPEN-SOURCE BaaS)</text>

    <text x="20" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Model Data: <tspan fill="#34D399" font-weight="bold">PostgreSQL Relasional</tspan></text>
    <text x="20" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Security: <tspan fill="#34D399" font-weight="bold">Row Level Security (RLS)</tspan></text>
    <text x="20" y="104" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Realtime: <tspan fill="#34D399" font-weight="bold">Postgres CDC Streaming</tspan></text>
    <text x="20" y="126" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Portabilitas: <tspan fill="#34D399" font-weight="bold">Bisa Self-Hosted di VPS</tspan></text>

    <rect x="15" y="145" width="220" height="45" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="165" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ideal untuk:</text>
    <text x="125" y="180" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Aplikasi Kompleks, E-Commerce, SaaS</text>
  </g>
</svg>
