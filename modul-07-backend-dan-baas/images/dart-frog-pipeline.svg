<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE SERVER BACKEND DART FROG: MIDDLEWARE ➔ ROUTE ➔ DATABASE</text>

  <!-- Step 1: Client Request -->
  <g transform="translate(30, 55)">
    <rect width="170" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="85" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. Client Request</text>

    <text x="85" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Flutter App HTTP</text>
    <text x="85" y="95" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">POST /api/orders</text>

    <rect x="10" y="125" width="150" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="85" y="145" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">Header: Bearer Token</text>
    <text x="85" y="162" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Body: {"item": "Laptop"}</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 150 L 235 150" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="235,145 245,150 235,155" fill="#38BDF8"/>

  <!-- Step 2: Global Middleware -->
  <g transform="translate(245, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="90" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. _middleware.dart</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Pipelines Interceptor:</text>

    <rect x="15" y="80" width="150" height="30" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="100" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">1. CORS Handler</text>

    <rect x="15" y="118" width="150" height="30" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="138" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">2. JWT Auth Check</text>

    <rect x="15" y="156" width="150" height="30" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="176" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">3. Request Logger</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 430 150 L 460 150" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="460,145 470,150 460,155" fill="#818CF8"/>

  <!-- Step 3: Route Handler -->
  <g transform="translate(470, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. routes/orders.dart</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Handler Method:</text>
    <text x="90" y="88" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">onRequest(context)</text>

    <rect x="15" y="110" width="150" height="65" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="90" y="132" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">switch (method) {</text>
    <text x="90" y="150" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">  POST =&gt; _create(),</text>
    <text x="90" y="168" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">}</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 655 150 L 685 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="685,145 695,150 685,155" fill="#10B981"/>

  <!-- Step 4: PostgreSQL Database -->
  <g transform="translate(695, 55)">
    <rect width="135" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <rect width="135" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="67" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4. Database</text>

    <text x="67" y="70" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PostgreSQL</text>
    <text x="67" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Connection Pool</text>

    <rect x="10" y="125" width="115" height="50" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="67" y="145" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">INSERT OK</text>
    <text x="67" y="163" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">Response 201</text>
  </g>
</svg>
