<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MEKANISME SSL/TLS PINNING: MENCEGAH SERANGAN MAN-IN-THE-MIDDLE (MITM)</text>

  <!-- Step 1: Mobile Client App -->
  <g transform="translate(30, 55)">
    <rect width="210" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="210" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="105" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. FLUTTER CLIENT</text>

    <!-- Pinned Hash Badge -->
    <rect x="15" y="45" width="180" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="105" y="66" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">Tersimpan Pinned Hash:</text>
    <text x="105" y="86" fill="#34D399" font-family="monospace" font-size="8" text-anchor="middle">SHA-256: 4a:8f:9b:c1:e2..</text>

    <text x="105" y="130" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">Kirim Request HTTPS ➔</text>
    <text x="105" y="165" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">Validasi Sertifikat OS</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 250 150 L 285 150" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="285,145 295,150 285,155" fill="#F43F5E"/>

  <!-- Step 2: MITM Hacker / Rogue Proxy -->
  <g transform="translate(295, 55)">
    <rect width="250" height="195" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="2" filter="url(#glow)"/>
    <rect width="250" height="32" rx="10" fill="#9F1239" fill-opacity="0.3"/>
    <text x="125" y="21" fill="#FDA4AF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. SERANGAN MITM (BURP/PROXY)</text>

    <text x="125" y="65" fill="#FDA4AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Hacker Pasang Sertifikat Palsu</text>

    <!-- Rogue Cert Box -->
    <rect x="15" y="80" width="220" height="55" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1"/>
    <text x="125" y="100" fill="#FDA4AF" font-family="monospace" font-size="9" text-anchor="middle">Rogue CA / Proxy Certificate</text>
    <text x="125" y="118" fill="#FDE047" font-family="monospace" font-size="8" text-anchor="middle">Hash: 99:aa:bb:cc:dd (TIDAK COCOK!)</text>

    <text x="125" y="165" fill="#FDA4AF" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">🚨 KONEKSI DIPUTUS SEKETIKA!</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 555 150 L 590 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="590,145 600,150 590,155" fill="#10B981"/>

  <!-- Step 3: Verified Authentic Bank Server -->
  <g transform="translate(590, 55)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="240" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="120" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. OFFICIAL BANK SERVER</text>

    <text x="120" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Server Asli (api.bank.com):</text>

    <rect x="15" y="80" width="210" height="55" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="120" y="100" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Valid EV SSL Certificate</text>
    <text x="120" y="118" fill="#34D399" font-family="monospace" font-size="8" text-anchor="middle">SHA-256: 4a:8f:9b:c1:e2.. (MATCH)</text>

    <text x="120" y="165" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">🔒 Handshake Sukses Aman</text>
  </g>
</svg>
