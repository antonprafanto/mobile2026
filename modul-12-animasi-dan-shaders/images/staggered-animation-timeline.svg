<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TIMELINE ANIMASI BERANTAI (STAGGERED ANIMATIONS DENGAN INTERVAL)</text>

  <!-- Master Controller Timeline (Top Bar) -->
  <g transform="translate(40, 55)">
    <rect width="780" height="35" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="15" y="22" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">Master Controller (0.0 ➔ 1.0) | Duration: 1200ms</text>
    <text x="745" y="22" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">100%</text>

    <!-- Timeline Tick marks -->
    <line x1="195" y1="28" x2="195" y2="35" stroke="#64748B" stroke-width="1.5"/>
    <line x1="390" y1="28" x2="390" y2="35" stroke="#64748B" stroke-width="1.5"/>
    <line x1="585" y1="28" x2="585" y2="35" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Staggered Layer 1: Card Fade & Slide In -->
  <g transform="translate(40, 105)">
    <rect width="780" height="42" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" fill="#F8FAFC" font-family="monospace" font-size="10">1. Header Card FadeIn</text>
    <!-- Interval Bar: 0.0 to 0.4 -->
    <rect x="200" y="8" width="220" height="26" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <text x="310" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Interval(0.0, 0.4)</text>
  </g>

  <!-- Staggered Layer 2: Chart Scale & Bezier Draw -->
  <g transform="translate(40, 155)">
    <rect width="780" height="42" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" fill="#F8FAFC" font-family="monospace" font-size="10">2. Chart ScaleUp &amp; Wave</text>
    <!-- Interval Bar: 0.3 to 0.7 -->
    <rect x="365" y="8" width="220" height="26" rx="4" fill="#059669" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="475" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Interval(0.3, 0.7)</text>
  </g>

  <!-- Staggered Layer 3: Transaction List & Buttons -->
  <g transform="translate(40, 205)">
    <rect width="780" height="42" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" fill="#F8FAFC" font-family="monospace" font-size="10">3. Action Button SlideUp</text>
    <!-- Interval Bar: 0.6 to 1.0 -->
    <rect x="530" y="8" width="220" height="26" rx="4" fill="#B45309" stroke="#F59E0B" stroke-width="1"/>
    <text x="640" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Interval(0.6, 1.0)</text>
  </g>
</svg>
