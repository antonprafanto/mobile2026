<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PIPELINE TYPE-SAFE INTEROPERABILITY DENGAN PIGEON CODE GENERATOR</text>

  <!-- Left: Schema Definition -->
  <g transform="translate(30, 55)">
    <rect width="250" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="125" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. PIGEON SCHEMA (.dart)</text>

    <rect x="15" y="45" width="220" height="135" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="68" fill="#FDE047" font-family="monospace" font-size="10">@HostApi()</text>
    <text x="25" y="86" fill="#38BDF8" font-family="monospace" font-size="10">abstract class BatteryApi {</text>
    <text x="35" y="104" fill="#F8FAFC" font-family="monospace" font-size="9">  BatteryInfo getInfo();</text>
    <text x="25" y="122" fill="#38BDF8" font-family="monospace" font-size="10">}</text>
    <text x="25" y="145" fill="#34D399" font-family="monospace" font-size="9">class BatteryInfo { ... }</text>
    <text x="25" y="165" fill="#94A3B8" font-family="monospace" font-size="9">  int level; double temp;</text>
  </g>

  <!-- Middle: Pigeon Compiler -->
  <g transform="translate(310, 85)">
    <rect width="180" height="135" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="180" height="30" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="90" y="20" fill="#FDE047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. PIGEON CLI COMPILER</text>

    <text x="90" y="55" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">dart run pigeon \</text>
    <text x="90" y="72" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">  --input pigeons/api.dart</text>

    <rect x="15" y="90" width="150" height="30" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="90" y="110" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Zero Typo &amp; Type-Safe</text>
  </g>

  <!-- Arrows from Middle to Right 3 outputs -->
  <path d="M 490 120 L 520 85" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 490 150 L 520 150" stroke="#10B981" stroke-width="2"/>
  <path d="M 490 180 L 520 215" stroke="#F43F5E" stroke-width="2"/>

  <!-- Right: Generated Outputs -->
  <g transform="translate(530, 50)">
    <!-- Dart Output -->
    <rect x="0" y="0" width="300" height="60" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1"/>
    <text x="15" y="22" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">📄 Dart Type-Safe Client API</text>
    <text x="15" y="42" fill="#BAE6FD" font-family="monospace" font-size="9">final info = await BatteryApi().getInfo();</text>

    <!-- Kotlin Output -->
    <rect x="0" y="70" width="300" height="60" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="15" y="92" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">📄 Android Kotlin Interface</text>
    <text x="15" y="112" fill="#A7F3D0" font-family="monospace" font-size="9">override fun getInfo(): BatteryInfo { ... }</text>

    <!-- Swift Output -->
    <rect x="0" y="140" width="300" height="60" rx="8" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1"/>
    <text x="15" y="162" fill="#FDA4AF" font-family="monospace" font-size="10" font-weight="bold">📄 iOS Swift Protocol</text>
    <text x="15" y="182" fill="#FECDD3" font-family="monospace" font-size="9">func getInfo() throws -&gt; BatteryInfo { ... }</text>
  </g>
</svg>
