<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="430" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SIKLUS HIDUP EKSEKUSI METHODCHANNEL: RPC DART KE NATIVE KOTLIN/SWIFT</text>

  <!-- Step 1: Dart Invoke -->
  <g transform="translate(30, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#0284C7" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1. Dart Invoke</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Panggil Method:</text>
    <text x="90" y="88" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">invokeMethod()</text>

    <rect x="10" y="110" width="160" height="65" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="132" fill="#FDE047" font-family="monospace" font-size="9" text-anchor="middle">final int level = await</text>
    <text x="90" y="150" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">channel.invokeMethod(</text>
    <text x="90" y="165" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">'getBatteryLevel');</text>
  </g>

  <!-- Arrow 1 (Forward) -->
  <path d="M 215 130 L 245 130" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="245,125 255,130 245,135" fill="#38BDF8"/>

  <!-- Step 2: Binary Codec -->
  <g transform="translate(255, 55)">
    <rect width="170" height="195" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#B45309" fill-opacity="0.25"/>
    <text x="85" y="21" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2. Encoding</text>

    <text x="85" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Binary Serialization:</text>

    <rect x="10" y="85" width="150" height="40" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="85" y="110" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">Dart ➔ Byte Stream</text>

    <rect x="10" y="135" width="150" height="40" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="85" y="160" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">Native ➔ Dart Result</text>
  </g>

  <!-- Arrow 2 (Forward) -->
  <path d="M 430 130 L 460 130" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="460,125 470,130 460,135" fill="#818CF8"/>

  <!-- Step 3: Native Host Execution -->
  <g transform="translate(470, 55)">
    <rect width="180" height="195" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#4F46E5" fill-opacity="0.2"/>
    <text x="90" y="21" fill="#A5B4FC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3. Native Execution</text>

    <text x="90" y="65" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Kotlin onMethodCall:</text>

    <rect x="10" y="80" width="160" height="95" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="90" y="105" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">if (call.method == "...") {</text>
    <text x="90" y="125" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">  val batt = getBatt()</text>
    <text x="90" y="145" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">  result.success(batt)</text>
    <text x="90" y="163" fill="#F8FAFC" font-family="monospace" font-size="9" text-anchor="middle">}</text>
  </g>

  <!-- Arrow 3 (Forward) -->
  <path d="M 655 130 L 685 130" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="685,125 695,130 685,135" fill="#10B981"/>

  <!-- Step 4: Final Dart Result -->
  <g transform="translate(695, 55)">
    <rect width="135" height="195" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
    <rect width="135" height="32" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="67" y="21" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4. UI Update</text>

    <text x="67" y="70" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Baterai: 85%</text>
    <text x="67" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Suhu: 32°C</text>

    <rect x="10" y="120" width="115" height="55" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="67" y="142" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">State Reaktif</text>
    <text x="67" y="160" fill="#A7F3D0" font-family="monospace" font-size="9" text-anchor="middle">Render di Layar</text>
  </g>
</svg>
