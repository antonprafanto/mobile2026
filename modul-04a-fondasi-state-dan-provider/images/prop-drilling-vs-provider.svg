<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#EF4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MENGAPA BUTUH PROVIDER? MASALAH PROP DRILLING VS DISTRIBUSI TERPUSAT</text>

  <!-- Left: Prop Drilling Problem -->
  <g transform="translate(30, 55)">
    <rect width="415" height="260" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="415" height="34" rx="12" fill="#991B1B" fill-opacity="0.25"/>
    <text x="207" y="22" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">❌ TANPA PROVIDER (PROP DRILLING)</text>

    <!-- Hierarchy -->
    <rect x="130" y="48" width="155" height="30" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="207" y="68" fill="#F8FAFC" font-family="monospace" font-size="11" text-anchor="middle">LayarUtama(cart)</text>

    <line x1="207" y1="78" x2="207" y2="98" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="265" y="92" fill="#F87171" font-family="monospace" font-size="9">oper parameter</text>

    <rect x="130" y="100" width="155" height="30" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="207" y="120" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">DaftarProduk(cart)</text>

    <line x1="207" y1="130" x2="207" y2="150" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="265" y="144" fill="#F87171" font-family="monospace" font-size="9">oper parameter</text>

    <rect x="130" y="152" width="155" height="30" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="207" y="172" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">ItemCard(cart)</text>

    <line x1="207" y1="182" x2="207" y2="202" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="265" y="196" fill="#F87171" font-family="monospace" font-size="9">oper parameter</text>

    <rect x="130" y="204" width="155" height="30" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="207" y="224" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TombolBeli(cart)</text>

    <!-- Bottom Warning Box -->
    <rect x="15" y="240" width="385" height="1" fill="#334155"/>
    <text x="207" y="252" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">⚠️ Widget perantara dipaksa menerima parameter yang tidak mereka butuhkan!</text>
  </g>

  <!-- Right: With Provider -->
  <g transform="translate(475, 55)">
    <rect width="415" height="260" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="415" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="207" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">✅ DENGAN PROVIDER (AKSES BEBAS DI MANA SAJA)</text>

    <!-- Central Provider Model Card -->
    <rect x="95" y="48" width="225" height="42" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="207" y="66" fill="#34D399" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">ChangeNotifierProvider</text>
    <text x="207" y="82" fill="#FDE047" font-family="monospace" font-size="10" text-anchor="middle">CartModel (Pusat Data Mandiri)</text>

    <!-- Clean Tree Middle -->
    <rect x="135" y="115" width="145" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="207" y="132" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">LayarUtama() [Bersih]</text>

    <line x1="207" y1="141" x2="207" y2="155" stroke="#334155" stroke-width="1.5"/>

    <rect x="135" y="155" width="145" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="207" y="172" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">DaftarProduk() [Bersih]</text>

    <!-- Direct Access Left & Right -->
    <!-- Direct Line to AppBar Badge -->
    <path d="M 105 90 C 40 120 40 180 50 205" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
    <rect x="15" y="208" width="150" height="34" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="224" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BadgeKeranjang</text>
    <text x="90" y="236" fill="#93C5FD" font-family="monospace" font-size="8.5" text-anchor="middle">context.watch&lt;Cart&gt;()</text>

    <!-- Direct Line to Buy Button -->
    <path d="M 310 90 C 375 120 375 180 365 205" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="250" y="208" width="150" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="325" y="224" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TombolBeli</text>
    <text x="325" y="236" fill="#A7F3D0" font-family="monospace" font-size="8.5" text-anchor="middle">context.read&lt;Cart&gt;()</text>

    <text x="207" y="254" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">✨ Tidak ada parameter oper-mengoper! Widget anak membaca data langsung.</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="324" width="860" height="26" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="341" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎯 Kesimpulan: Provider membebaskan widget dari kerepotan mengoper parameter ke anak cucunya!</text>
</svg>

