<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARSITEKTUR PROVIDER: ALUR DATA REAKTIF CHANGENOTIFIER</text>

  <!-- Card 1: ChangeNotifier (Model Data) -->
  <g transform="translate(30, 55)">
    <rect width="255" height="250" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="255" height="34" rx="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="127" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">1. MODEL STATE (Pengeras Suara)</text>

    <text x="20" y="62" fill="#94A3B8" font-family="monospace" font-size="10.5">// Menyimpan data dan logika:</text>
    <rect x="15" y="72" width="225" height="75" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="25" y="92" fill="#E2E8F0" font-family="monospace" font-size="11">class CartModel</text>
    <text x="35" y="110" fill="#38BDF8" font-family="monospace" font-size="11">  extends ChangeNotifier {</text>
    <text x="35" y="130" fill="#FDE047" font-family="monospace" font-size="11">  int total = 0;</text>

    <text x="127" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Picu Pembaruan UI:</text>
    <rect x="15" y="184" width="225" height="42" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="127" y="210" fill="#FDE047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">notifyListeners();</text>

    <text x="127" y="248" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Memberitahu seluruh pendengar aktif</text>
  </g>

  <!-- Arrow 1 -> 2: notifyListeners -->
  <g transform="translate(285, 145)">
    <line x1="10" y1="20" x2="45" y2="20" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="28" y="10" fill="#38BDF8" font-family="monospace" font-size="9.5" text-anchor="middle">Siaran</text>
  </g>

  <!-- Card 2: ChangeNotifierProvider (Wadah Penghubung) -->
  <g transform="translate(340, 55)">
    <rect width="245" height="250" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="245" height="34" rx="12" fill="#4F46E5" fill-opacity="0.25"/>
    <text x="122" y="22" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">2. PROVIDER CONTAINER</text>

    <text x="20" y="62" fill="#94A3B8" font-family="monospace" font-size="10.5">// Ditaruh di atas pohon widget:</text>
    <rect x="15" y="72" width="215" height="95" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="25" y="94" fill="#E2E8F0" font-family="monospace" font-size="10.5">ChangeNotifierProvider(</text>
    <text x="35" y="114" fill="#A5B4FC" font-family="monospace" font-size="10.5">  create: (_) =&gt;</text>
    <text x="45" y="132" fill="#38BDF8" font-family="monospace" font-size="10.5">    CartModel(),</text>
    <text x="35" y="152" fill="#E2E8F0" font-family="monospace" font-size="10.5">  child: MyApp(),</text>

    <text x="122" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Cakupan Distribusi Data:</text>
    <rect x="15" y="206" width="215" height="34" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <text x="122" y="228" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tersedia untuk Seluruh Anak Widget</text>
  </g>

  <!-- Arrow 2 -> 3: Konsumsi Data -->
  <g transform="translate(585, 145)">
    <line x1="10" y1="20" x2="45" y2="20" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="28" y="10" fill="#10B981" font-family="monospace" font-size="9.5" text-anchor="middle">Konsumsi</text>
  </g>

  <!-- Card 3: UI Widget Listeners (Penerima) -->
  <g transform="translate(640, 55)">
    <rect width="250" height="250" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="250" height="34" rx="12" fill="#059669" fill-opacity="0.25"/>
    <text x="125" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">3. METODE AKSES DI UI</text>

    <!-- Watch Box -->
    <rect x="15" y="48" width="220" height="52" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="68" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">context.watch&lt;T&gt;()</text>
    <text x="25" y="88" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Ikut rebuild tiap data berubah</text>

    <!-- Read Box -->
    <rect x="15" y="110" width="220" height="52" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="130" fill="#FDE047" font-family="monospace" font-size="11" font-weight="bold">context.read&lt;T&gt;()</text>
    <text x="25" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Hanya baca 1x (untuk tombol aksi)</text>

    <!-- Select Box -->
    <rect x="15" y="172" width="220" height="64" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="25" y="192" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">context.select&lt;T, R&gt;()</text>
    <text x="25" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Hanya rebuild jika field spesifik</text>
    <text x="25" y="226" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">yang dipantau mengalami perubahan</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="318" width="860" height="30" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
  <text x="460" y="338" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">💡 Aturan Emas: Gunakan watch() di dalam build(), gunakan read() di dalam tombol onPressed()!</text>
</svg>

